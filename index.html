const compressImage = (dataUrl, maxSize=200, quality=0.75) => new Promise(resolve => {
  const img = new Image();
  img.onload = () => {
    const scale = Math.min(maxSize/img.width, maxSize/img.height, 1);
    const canvas = document.createElement('canvas');
    canvas.width  = Math.round(img.width  * scale);
    canvas.height = Math.round(img.height * scale);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    resolve(canvas.toDataURL('image/jpeg', quality));
  };
  img.onerror = () => resolve(dataUrl);
  img.src = dataUrl;
});

/* ══ UI PRIMITIVES ══ */
function MiniBar({v}) {
  const c = v>=100?"bg-gray-400":v>=60?"bg-blue-500":v>=30?"bg-amber-400":"bg-red-400";
  return (
    <div className="flex items-center gap-1.5">
      <div className="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden">
        <div className={`h-full rounded-full ${c}`} style={{width:`${Math.min(v,100)}%`}}/>
      </div>
      <span className="text-xs text-gray-500 w-7 text-right tabular-nums">{v}%</span>
    </div>
  );
}

function Editable({value, onChange, className="", placeholder="클릭하여 입력"}) {
  const canEdit = useRole() === "editor";
  const [ed, setEd] = useState(false);
  const [draft, setDraft] = useState(value);
  const commit = () => { onChange(draft.trim()||value); setEd(false); };
  if (!canEdit) return <span className={className}>{value||<span className="text-gray-400 italic text-xs">{placeholder}</span>}</span>;
  if (ed) return (
    <input autoFocus value={draft} placeholder={placeholder}
      className="border-b-2 border-blue-400 bg-transparent focus:outline-none w-full min-w-16"
      style={{fontSize:"inherit",fontWeight:"inherit"}}
      onChange={e=>setDraft(e.target.value)}
      onBlur={commit}
      onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape"){setDraft(value);setEd(false);}}}
    />
  );
  return (
    <span className={`group/ed inline-flex items-center gap-1 ${className}`}
      onDoubleClick={e=>{e.stopPropagation();setDraft(value);setEd(true);}}>
      <span>{value||<span className="text-gray-400 italic text-xs">{placeholder}</span>}</span>
      <button className="opacity-0 group-hover/ed:opacity-50 hover:!opacity-100 text-gray-400 hover:text-blue-500 text-xs"
        onClick={e=>{e.stopPropagation();setDraft(value);setEd(true);}}>✏️</button>
    </span>
  );
}

function EditNum({value, min=0, max=999999, suffix="", onChange}) {
  const canEdit = useRole() === "editor";
  const [ed, setEd] = useState(false);
  const [draft, setDraft] = useState(value);
  const commit = () => { onChange(Math.min(max,Math.max(min,Number(draft)||0))); setEd(false); };
  if (!canEdit) return <span className="tabular-nums">{value}{suffix}</span>;
  if (ed) return (
    <input autoFocus type="number" value={draft} min={min} max={max}
      className="w-14 border border-blue-400 rounded px-1 text-sm text-center focus:outline-none"
      onChange={e=>setDraft(e.target.value)} onBlur={commit}
      onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape")setEd(false);}}
    />
  );
  return <span className="cursor-pointer hover:text-blue-600 hover:underline" title="클릭 수정"
    onClick={e=>{e.stopPropagation();setDraft(value);setEd(true);}}>{value}{suffix}</span>;
}

function AddInput({placeholder, onAdd, onCancel}) {
  const [v, setV] = useState("");
  const go = () => { if(v.trim()) onAdd(v.trim()); else onCancel(); };
  return (
    <div className="flex items-center gap-1 mt-1.5" onClick={e=>e.stopPropagation()}>
      <input autoFocus value={v} placeholder={placeholder}
        className="flex-1 text-xs border border-blue-300 rounded-lg px-2 py-1 focus:outline-none focus:ring-1 focus:ring-blue-400"
        onChange={e=>setV(e.target.value)}
        onKeyDown={e=>{if(e.key==="Enter")go();if(e.key==="Escape")onCancel();}}
      />
      <button onClick={go} className="text-xs bg-blue-500 text-white px-2 py-1 rounded-lg hover:bg-blue-600 flex-shrink-0">추가</button>
      <button onClick={onCancel} className="text-xs text-gray-400 hover:text-gray-600 px-1">✕</button>
    </div>
  );
}

/* ── 제품 이미지 컴포넌트 ── */
function ProductImage({image, name, size="sm", onChange}) {
  const canEdit = useRole() === "editor";
  const fileRef = useRef();
  const sz = size==="lg" ? "w-28 h-28 rounded-xl text-3xl" : size==="md" ? "w-16 h-16 rounded-lg text-2xl" : "w-10 h-10 rounded-lg text-base";
  const handleFile = e => {
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      compressImage(ev.target.result, 200, 0.75).then(onChange);
    };
    reader.readAsDataURL(f);
    e.target.value = "";
  };
  return (
    <div className={`relative flex-shrink-0 group/img ${sz} overflow-hidden bg-gray-100 flex items-center justify-center`}
      style={{cursor: canEdit ? "pointer" : "default"}}
      onClick={e=>{ if(canEdit){e.stopPropagation();fileRef.current?.click();} }}>
      {image
        ? <img src={image} alt={name} className="w-full h-full object-cover"/>
        : <span className="select-none">📦</span>
      }
      {canEdit && (
        <div className="absolute inset-0 bg-black/40 opacity-0 group-hover/img:opacity-100 transition-opacity flex flex-col items-center justify-center gap-0.5">
          <span className="text-white text-xs font-medium leading-tight">{image?"변경":"사진추가"}</span>
          {image && <button className="text-red-300 hover:text-red-400 text-xs leading-tight"
            onClick={e=>{e.stopPropagation();onChange(null);}}>✕삭제</button>}
        </div>
      )}
      <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleFile}/>
    </div>
  );
}

function AssigneeSelect({value, onChange, done=false, readOnly=false}) {
  const canEdit = useRole() === "editor";
  const { members, memberColors } = useMembers();
  const [open, setOpen] = useState(false);
  const color = done?"bg-gray-300":value ? getmc(value, memberColors) : "bg-gray-300";

    return <span className={`assignee-tag ${done?"assignee-complete":"assignee-pending"}`}><span aria-hidden="true" className={`assignee-dot ${color}`}/>{value}</span>;
  }
  return (
    <div className="relative flex-shrink-0" onClick={e=>e.stopPropagation()}>
      <button onClick={()=>setOpen(!open)}
        className={`inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full flex-shrink-0 transition-all
          ${value ? `text-white ${color}` : "text-gray-400 border border-dashed border-gray-300 hover:border-blue-400 hover:text-blue-400"}`}>
        {value ? <span>{value}</span> : <span>담당자</span>}
        <span className="opacity-60">▾</span>
      </button>
      {open && (
        <div className="absolute left-0 top-full mt-1 z-30 bg-white border border-gray-200 rounded-lg shadow-lg py-1 min-w-28">
          <button onClick={()=>{onChange(null);setOpen(false);}} className="w-full text-left text-xs px-3 py-1.5 hover:bg-gray-50 text-gray-400">담당자 없음</button>
          {members.map(m=>(
            <button key={m} onClick={()=>{onChange(m);setOpen(false);}}
              className={`w-full text-left text-xs px-3 py-1.5 hover:bg-blue-50 flex items-center gap-2 ${value===m?"font-semibold text-blue-600":""}`}>
              <span className={`w-2 h-2 rounded-full flex-shrink-0 ${getmc(m,memberColors)}`}/>{m}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── D-day 태스크 마감일 ── */
function TaskDeadlinePill({value, onChange, done=false}) {
  const canEdit = useRole() === "editor";
  const [editing, setEditing] = useState(false);
  const today = new Date(); today.setHours(0,0,0,0);
  const d = value ? dl(value) : null;
  const label = d===null?null:d<0?`D+${Math.abs(d)}`:(d<0?`D+${Math.abs(d)}`:`D-${d}`);
  const color = d===null?""
    :d<0?"bg-red-100 text-red-600 border-red-200"
    :d===0?"bg-red-50 text-red-500 border-red-200"
    :d<=3?"bg-orange-100 text-orange-600 border-orange-200"
    :d<=7?"bg-amber-100 text-amber-600 border-amber-200"
    :"bg-gray-100 text-gray-500 border-gray-200";
  if(done)return value?<span className="text-xs px-1.5 py-0.5 rounded-full border border-gray-200 bg-gray-50 text-gray-500" title={`완료된 업무의 기한: ${value}`}>{value} · 완료</span>:null;
  if (!canEdit) {
    if (!value) return null;
    return <span className={`text-xs px-1.5 py-0.5 rounded-full border font-medium flex-shrink-0 ${color}`} title={value}>{label}</span>;
  }
  if (editing) return (
    <input type="date" autoFocus value={value||""}
      className="text-xs border border-blue-300 rounded-lg px-1.5 py-0.5 focus:outline-none focus:ring-1 focus:ring-blue-400 flex-shrink-0"
      style={{width:"7.5rem"}}
      onChange={e=>onChange(e.target.value||null)} onBlur={()=>setEditing(false)}
      onKeyDown={e=>{if(e.key==="Escape")setEditing(false);}} onClick={e=>e.stopPropagation()}/>
  );
  return value
    ? <button onClick={e=>{e.stopPropagation();setEditing(true);}}
        className={`text-xs px-1.5 py-0.5 rounded-full border font-medium flex-shrink-0 transition-opacity hover:opacity-75 ${color}`}
        title={`마감일: ${value}`}>{label}</button>
    : <button onClick={e=>{e.stopPropagation();setEditing(true);}}
        className="opacity-0 group-hover/task:opacity-60 hover:!opacity-100 text-gray-400 hover:text-blue-500 text-xs flex-shrink-0 px-0.5"
        title="D-day 설정">📅</button>;
}

function TaskPanel({tasks, groupMeta={}, onUpdate, onUpdateGroupMeta, hideCompleted=false, completedOnly=false}) {
  const canEdit = useRole() === "editor";
  const [addingTo, setAddingTo] = useState(null);
  const [newGroup, setNewGroup] = useState(false);
  const [newGroupName, setNewGroupName] = useState("");
  const [editingGroup, setEditingGroup] = useState(null);
  const [groupDraft, setGroupDraft] = useState({name:"", colorIdx:0});

  const up   = fn => onUpdate(fn);
  const toggleTask  = tid => up(ts=>ts.map(t=>t.id===tid?{...t,done:!t.done}:t));
  const deleteTask  = tid => up(ts=>ts.filter(t=>t.id!==tid));
  const renameTask  = (tid,l) => up(ts=>ts.map(t=>t.id===tid?{...t,label:l}:t));
  const toggleOpen  = tid => up(ts=>ts.map(t=>t.id===tid?{...t,open:!t.open}:t));
  const addTask     = (label,group) => { up(ts=>[...ts,mkT(label,group)]); setAddingTo(null); };
  const assignTask  = (tid,assignee) => up(ts=>ts.map(t=>t.id===tid?{...t,assignee}:t));
  const setDeadline = (tid,deadline) => up(ts=>ts.map(t=>t.id===tid?{...t,deadline}:t));
  const addSub      = (tid,l) => up(ts=>ts.map(t=>t.id===tid?{...t,open:true,subtasks:[...t.subtasks,{id:uid(),label:l,done:false}]}:t));
  const toggleSub   = (tid,sid) => up(ts=>ts.map(t=>t.id===tid?{...t,subtasks:t.subtasks.map(s=>s.id===sid?{...s,done:!s.done}:s)}:t));
  const deleteSub   = (tid,sid) => up(ts=>ts.map(t=>t.id===tid?{...t,subtasks:t.subtasks.filter(s=>s.id!==sid)}:t));
  const renameSub   = (tid,sid,l) => up(ts=>ts.map(t=>t.id===tid?{...t,subtasks:t.subtasks.map(s=>s.id===sid?{...s,label:l}:s)}:t));

  const startEditGroup = (grp) => {
    const cidx = getGroupColorIdx(grp, groupMeta);
    setGroupDraft({name: grp, colorIdx: cidx});
    setEditingGroup(grp);
  };
  const commitGroupEdit = () => {
    const oldName = editingGroup;
    const {name: newName, colorIdx} = groupDraft;
    if(!newName.trim()) return;
    // rename tasks
    if(newName !== oldName) up(ts=>ts.map(t=>t.group===oldName?{...t,group:newName}:t));
    // update groupMeta
    if(onUpdateGroupMeta) {
      const newMeta = {...groupMeta};
      newMeta[newName] = {colorIdx};
      if(newName !== oldName) delete newMeta[oldName];
      onUpdateGroupMeta(newMeta);
    }
    setEditingGroup(null);
  };

  const visibleTasks=tasks.filter(t=>completedOnly?t.done:hideCompleted?!t.done:true);
  const groups = [...new Set(visibleTasks.map(t=>t.group))];
  const done = tasks.filter(t=>t.done).length;
  const pct  = tasks.length>0?Math.round((done/tasks.length)*100):0;
  const handleNewGroup = () => { if(newGroupName.trim()){ addTask("새 태스크",newGroupName.trim()); setNewGroup(false); setNewGroupName(""); }};

  return (
    <div className="space-y-4" onClick={e=>e.stopPropagation()}>
      {!hideCompleted&&!completedOnly&&<div className="flex items-center gap-3">
        <div className="flex-1"><MiniBar v={pct}/></div>
        <span className="text-xs text-gray-400 flex-shrink-0">{done}/{tasks.length} 완료</span>
      </div>}
      {groups.map(grp=>{
        const grpTasks=visibleTasks.filter(t=>t.group===grp), gDone=grpTasks.filter(t=>t.done).length;
        const col=getGroupCol(grp, groupMeta);
        const isAdding=addingTo===grp;
        const isEditing=editingGroup===grp;
        return (
          <div key={grp} className="bg-white rounded-lg border border-gray-100 p-3 space-y-2">
            <div className="flex items-center justify-between">
              {isEditing ? (
                <div className="flex items-center gap-2 flex-1" onClick={e=>e.stopPropagation()}>
                  {/* 색상 선택 */}
                  <div className="flex gap-1 flex-wrap">
                    {PAL.map((p,i)=>(
                      <button key={i} onClick={()=>setGroupDraft(d=>({...d,colorIdx:i}))}
                        className={`w-5 h-5 rounded-full ${p.dot} transition-all hover:scale-110 ${groupDraft.colorIdx===i?"ring-2 ring-offset-1 ring-gray-500 scale-110":""}`}/>
                    ))}
                  </div>
                  <input autoFocus value={groupDraft.name}
                    className="border border-blue-300 rounded-lg px-2 py-0.5 text-xs focus:outline-none focus:ring-1 focus:ring-blue-400 w-28"
                    onChange={e=>setGroupDraft(d=>({...d,name:e.target.value}))}
                    onKeyDown={e=>{if(e.key==="Enter")commitGroupEdit();if(e.key==="Escape")setEditingGroup(null);}}
                  />
                  <button onClick={commitGroupEdit} className="text-xs bg-blue-500 text-white px-2 py-0.5 rounded-lg hover:bg-blue-600">저장</button>
                  <button onClick={()=>setEditingGroup(null)} className="text-xs text-gray-400 px-1">✕</button>
                </div>
              ) : (
                <span className={`text-xs font-medium px-2 py-0.5 rounded-full border inline-flex items-center gap-1.5 ${gDone===grpTasks.length?"bg-gray-50 border-gray-200 text-gray-500":col.bd}`}>
                  <span className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${gDone===grpTasks.length?"bg-gray-300":col.dot}`}/>{grp}
                  <span className="text-gray-400 font-normal">{gDone}/{grpTasks.length}</span>
                  {canEdit&&!completedOnly&&<button onClick={e=>{e.stopPropagation();startEditGroup(grp);}}
                    className="opacity-60 hover:opacity-100 text-xs ml-0.5" title="그룹 편집">✏️</button>}
                </span>
              )}
              {canEdit&&!completedOnly&&!isEditing&&<button onClick={()=>setAddingTo(isAdding?null:grp)} className="text-xs text-blue-400 hover:text-blue-600 hover:bg-blue-50 px-1.5 py-0.5 rounded">+ 태스크</button>}
            </div>
            <div className="space-y-0.5 pl-0.5">
              {grpTasks.map(t=>(
                <TaskRow key={t.id} task={t}
                  onToggle={()=>toggleTask(t.id)} onDelete={()=>deleteTask(t.id)} onRename={l=>renameTask(t.id,l)}
                  onToggleOpen={()=>toggleOpen(t.id)} onAssign={a=>assignTask(t.id,a)}
                  onSetDeadline={d=>setDeadline(t.id,d)}
                  onAddSub={l=>addSub(t.id,l)} onToggleSub={sid=>toggleSub(t.id,sid)}
                  onDeleteSub={sid=>deleteSub(t.id,sid)} onRenameSub={(sid,l)=>renameSub(t.id,sid,l)}/>
              ))}
            </div>
            {canEdit&&!completedOnly&&isAdding&&<AddInput placeholder="새 태스크 이름..." onAdd={l=>addTask(l,grp)} onCancel={()=>setAddingTo(null)}/>}
          </div>
        );
      })}
      {canEdit&&!completedOnly&&(
        <div className="border-t border-dashed border-gray-200 pt-2">
          {newGroup
            ?<div className="flex items-center gap-1.5">
              <input autoFocus value={newGroupName} placeholder="새 그룹 이름..."
                className="flex-1 text-xs border border-blue-300 rounded-lg px-2 py-1.5 focus:outline-none"
                onChange={e=>setNewGroupName(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter")handleNewGroup();if(e.key==="Escape"){setNewGroup(false);setNewGroupName("");}}}
              />
              <button onClick={handleNewGroup} className="text-xs bg-blue-500 text-white px-2 py-1.5 rounded-lg hover:bg-blue-600">생성</button>
              <button onClick={()=>{setNewGroup(false);setNewGroupName("");}} className="text-xs text-gray-400 px-1">✕</button>
            </div>
            :<button onClick={()=>setNewGroup(true)} className="text-xs text-gray-400 hover:text-blue-500 flex items-center gap-1 py-1 hover:bg-blue-50 px-2 rounded-lg w-full"><span className="text-base leading-none">＋</span> 새 그룹 추가</button>
          }
        </div>
      )}
    </div>
  );
}

/* ══ TEAM VIEW ══ */
const TEAM_UNASSIGNED_KEY=Object.freeze({type:"unassigned"});
const TEAM_ALL_KEY=Object.freeze({type:"all"});
const teamGroupKey=key=>key===TEAM_ALL_KEY?"all":key===TEAM_UNASSIGNED_KEY?"unassigned":JSON.stringify(["member",key]);
const teamTaskKey=t=>JSON.stringify([t.productId,t.section,t.id]);
function collectTeamTasks(prods){let order=0;return prods.flatMap(p=>[["pt","기획"],["ct","콘텐츠"],["mt","마케팅"]].flatMap(([section,typeLabel])=>(p[section]||[]).map(t=>({...t,product:p.name,productId:p.id,section,typeLabel,order:order++,taskKey:JSON.stringify([p.id,section,t.id])}))));}
function applyTeamTaskCompletion(prods,target,done,expected){
 if(!["pt","ct","mt"].includes(target.section)||typeof done!=="boolean")return {prods,error:"업무 정보를 확인해 주세요.",changed:false};
 const products=prods.filter(p=>p.id===target.productId),tasks=products.length===1?(products[0][target.section]||[]).filter(t=>t.id===target.id):[];
 if(products.length!==1||tasks.length!==1)return {prods,error:"업무가 삭제되었거나 식별자가 중복되어 변경하지 않았습니다.",changed:false};
 if(expected!==undefined&&!!tasks[0].done!==expected)return {prods,error:"업무 상태가 이미 바뀌어 되돌리기를 적용하지 않았습니다.",changed:false};
 if(!!tasks[0].done===done)return {prods,error:"",changed:false};
 return {prods:prods.map(p=>p.id===target.productId?{...p,[target.section]:p[target.section].map(t=>t.id===target.id?{...t,done}:t)}:p),error:"",changed:true};
}
function TeamTaskItem({task:t,canEdit,onChange}){

 return <label className={`team-task-item ${t.done?"completed":""}`}><input type="checkbox" checked={!!t.done} disabled={!canEdit} aria-label={`${t.product} · ${t.typeLabel} · ${t.label} ${t.done?"완료 해제":"완료 표시"}`} onChange={e=>canEdit&&onChange(t,e.target.checked)}/><span><strong>{t.label}</strong><small>{t.product} · {t.typeLabel}</small>{dated&&<em>기한 {t.deadline.replaceAll('-','.')}</em>}</span></label>;
}
function TeamView({prods,onEditMember,onSetTaskDone}){
 const canEdit=useRole()==="editor",{members,setMembers,memberColors}=useMembers();
 const [selected,setSelected]=useState(TEAM_ALL_KEY),[addingMember,setAddingMember]=useState(false),[editingMember,setEditingMember]=useState(null),[notice,setNotice]=useState(null),[error,setError]=useState("");
 const allTasks=useMemo(()=>collectTeamTasks(prods),[prods]);
 const unknown=[...new Set(allTasks.filter(t=>t.assignee&&!members.includes(t.assignee)).map(t=>t.assignee))];
 const names=[...members,...unknown],unassigned=allTasks.filter(t=>!t.assignee),groupKeys=[...names,...(unassigned.length?[TEAM_UNASSIGNED_KEY]:[])];
 const tasksFor=key=>key===TEAM_UNASSIGNED_KEY?unassigned:allTasks.filter(t=>t.assignee===key);
 const shown=selected===TEAM_ALL_KEY?groupKeys:groupKeys.includes(selected)?[selected]:groupKeys;
 const labelFor=key=>key===TEAM_ALL_KEY?"전체":key===TEAM_UNASSIGNED_KEY?"담당자 미정":key;
 const change=(task,done)=>{if(!canEdit||!onSetTaskDone)return;const message=onSetTaskDone({productId:task.productId,section:task.section,id:task.id},done);if(message){setError(message);return;}setError("");setNotice({target:{productId:task.productId,section:task.section,id:task.id},label:task.label,previous:!!task.done,current:done});};
 const undo=()=>{if(!notice||!canEdit)return;const message=onSetTaskDone(notice.target,notice.previous,notice.current);if(message)setError(message);else setError("");setNotice(null);};
 const addMember=name=>{if(members.includes(name))return;const next=[...members,name];setMembers(next);saveMembers(next);setAddingMember(false);};

 return <section className="inventory-import"><div><strong>재고 엑셀 업데이트</strong><p>파일 선택 → 변경 확인 → 반영 후 저장</p></div><label className="import-file">.xls 파일 선택<input type="file" accept=".xls" onChange={choose} aria-label="이지어드민 재고 파일 선택" disabled={!canEdit}/></label><small>이지어드민 HTML 형식 .xls 지원 · .xlsx/일반 바이너리 .xls 미지원 · 파일은 외부로 전송되지 않습니다</small>{!canEdit&&<p>재고 업데이트는 기존 편집 모드를 켠 뒤 사용할 수 있습니다.</p>}{busy&&<p role="status">파일 확인 중… <button onClick={cancel}>취소</button></p>}{error&&<p className="import-error" role="alert">{error}</p>}{message&&<p className="import-success" role="status">{message}</p>}{staged&&<div className="import-review"><strong>변경 미리보기 · {staged.inventory.rows.length}개 원본 행</strong><p>{staged.inventory.sourceFilename}</p><small>파일명 시각: {staged.inventory.filenameTimestamp} · 시간대·실제 재고 기준 시각 미확인</small>{staged.older&&<label className="older-warning"><input type="checkbox" checked={acceptOlder} onChange={e=>setAcceptOlder(e.target.checked)}/> 기존 파일보다 과거 시각입니다. 이전 자료임을 확인하고 반영합니다</label>}{staged.sameTime&&<p className="inventory-muted">기존 파일과 파일명 시각이 같습니다. 수량 변경 내역을 확인해 주세요</p>}<div className="import-changes">{staged.changes.map(c=><div key={c.id}><strong>{c.name.split(' (')[0]}</strong><span>{invNum(c.old)} → {c.status==="missing"?"이전값 유지":invNum(c.next)}</span><small className={c.status==="missing"?"import-error":""}>{c.detail}</small></div>)}</div><p className="inventory-muted">확인된 6개 연결 규칙만 사용합니다. 진드기 시트·소금총은 자동 연결하지 않습니다</p><div className="import-actions"><button onClick={cancel}>취소</button><button disabled={!canEdit||staged.older&&!acceptOlder} onClick={apply}>변경 반영</button></div></div>}</section>;
}

function InventoryView({prods,inventory,onApply,expandMappings=false}) {

 <div className="data-notice"><span className="notice-dot"/><p><strong>확인된 제품만 재고를 연결했습니다</strong> 확인된 제품 연결 규칙을 사용합니다. 야광끈끈이스틱의 1+1만 2개로 환산하고 나머지는 원본 상품 단위를 유지합니다. 새로운 제품은 임의 연결하지 않습니다.</p></div>

 <div className="inventory-summary"><div><span>원본 상품 행</span><strong>{INVENTORY.rows.length}</strong></div><div><span>확정 연결</span><strong>{inventoryConfirmed(prods)} <small>/ {prods.length}개 제품</small></strong></div><div><span>재고 기준 시각</span><strong className="small-value">원본에 없음</strong></div><div><span>대시보드 재고</span><strong className="small-value">{inventoryConfirmed(prods)}개 연결 · {prods.filter(p=>p.inventoryStale).length}개 이전값</strong></div></div>
 <div className="section-title"><div><p className="eyebrow">PRODUCT MAPPING</p><h2>제품별 연결 후보</h2></div><span className="inventory-muted">이전 재고는 참고값 · 현재 확정값과 구분</span></div>
 <div className="mapping-list" id="inventory-mappings">{prods.map(p=><details className="mapping-row" key={p.id} open={expandMappings||undefined}><summary><span><strong>{p.name}</strong><small>{p.confirmedInventory?`${p.inventoryStale?"이전값 (최신 아님)":"가용재고"} ${invNum(p.stock)}${p.confirmedInventory.formula?"개 (1+1 환산)":" · 원본 상품 단위"} · ${p.confirmedInventory.sourceName}`:`기존 대시보드 참고값 ${invNum(p.legacyStock??p.stock)} · 현재 재고 확인 필요`}</small></span><span className="mapping-pill" style={p.confirmedInventory?{background:"#e6f1e7",color:"#2d6839"}:undefined}>{p.inventoryStale?"원본 행 누락 ▾":p.confirmedInventory?"연결 확인됨 ▾":"연결 미확정 ▾"}</span></summary><div className="mapping-body">{p.confirmedInventory?.formula&&<strong style={{display:"block",color:"#2c643b",marginBottom:10}}>{p.confirmedInventory.formula}</strong>}<p>{INVENTORY.mapping[String(p.id)]?.note||"원본에 제품 코드가 없어 연결을 확정할 수 없습니다."}</p><div>{(p.inventoryStale?[]:p.confirmedInventory?(p.confirmedInventory.sourceRows||[p.confirmedInventory.sourceRow]):(INVENTORY.mapping[String(p.id)]?.candidates||[])).map(id=>{const r=INVENTORY.rows.find(x=>x.id===id);return r?<div className="candidate-line" key={id}><strong>{r.name}</strong><span>정상 {invNum(r.normal)} · 가용 {invNum(r.available)}</span></div>:null})}</div>{!(INVENTORY.mapping[String(p.id)]?.candidates||[]).length&&<small>확인된 후보 없음 · 원본 상품명과 제품 구성을 확인해 주세요</small>}</div></details>)}</div>
 <div className="section-title source-section"><div><p className="eyebrow">IMPORTED RECORDS</p><h2>원본 재고 목록 <span>{rows.length}</span></h2></div></div>

 <div className="inventory-table-scroll"><table className="inventory-table"><thead><tr><th>상품명</th><th>정상재고</th><th>불량재고</th><th>가용재고</th><th>처음입고수량</th></tr></thead><tbody>{rows.map(r=><tr key={r.id}><th scope="row">{r.name}</th><td>{invNum(r.normal)}</td><td>{invNum(r.defective)}</td><td><span className={r.available<0||r.available>r.normal?"inventory-warning":""}>{invNum(r.available)}</span></td><td>{invNum(r.initial)}</td></tr>)}</tbody></table>{rows.length===0&&<div className="empty-state">조건에 맞는 상품이 없습니다<button onClick={()=>{setQuery("");setOnlyIssues(false);}}>검색 초기화</button></div>}</div>
 <p className="inventory-footnote">{INVENTORY.publicMappedOnly?"공개 화면에는 확인된 연결에 필요한 상품 행만 포함됩니다. ":""}출처: {INVENTORY.sourceFilename} · 파일명 시각 {INVENTORY.filenameTimestamp} (시간대 미상, 재고 기준 시각으로 확인되지 않음) · 원본 열 이름 유지 · 제품별 수량은 단위가 달라 전체 합계로 표시하지 않습니다 · 상품명 외 식별자·창고·추출 시각·단위 정보 없음. 가용재고가 정상재고보다 크거나 음수인 행은 확인 대상으로 표시하며 원본 값을 수정하지 않았습니다.</p></section>;
}

function Overview({prods,onOpen,onTeam,onInventory}) {
 const [focus,setFocus]=useState("all");
 const tasks=prods.flatMap(p=>[...(p.pt||[]),...(p.ct||[]),...(p.mt||[])].map(t=>({...t,product:p})));
 const pending=tasks.filter(t=>!t.done); const unassigned=pending.filter(t=>!t.assignee);
 const deadlines=prods.flatMap(p=>[...(p.status!=="판매중"&&p.deadline?[{p,date:p.deadline,label:"출시 일정"}]:[]),...(p.reorder?.deadline?[{p,date:p.reorder.deadline,label:"재발주 입고"}]:[])]);
 const past=deadlines.filter(d=>dl(d.date)<0); const week=deadlines.filter(d=>dl(d.date)>=0&&dl(d.date)<=7);
 const stock=prods.filter(p=>p.inventoryStale||!p.confirmedInventory||p.stock===null||p.status==="판매중"&&p.stock===0);
 const filtered=prods.filter(p=>focus==="all"||focus==="dates"&&past.some(x=>x.p.id===p.id)||focus==="week"&&week.some(x=>x.p.id===p.id)||focus==="stock"&&stock.includes(p)||focus==="owner"&&unassigned.some(t=>t.product.id===p.id));
 const cards=[{key:"dates",label:"기한 확인",n:past.length,unit:"일정",desc:"지난 일정의 현재 상태 확인",tone:"coral",icon:"↗"},{key:"week",label:"이번 주",n:week.length,unit:"일정",desc:"기준일부터 7일 이내 도래",tone:"blue",icon:"◷"},{key:"stock",label:"재고 확인",n:stock.length,unit:"제품",desc:"연결 미확정 또는 확인 재고 0",tone:"amber",icon:"▣"},{key:"owner",label:"담당자 미정",n:unassigned.length,unit:"업무",desc:"미완료 업무에 담당자 배정",tone:"purple",icon:"◎"}];
 return <div className="overview"><section className="intro"><div><p className="eyebrow">OPERATIONAL BRIEF / {AS_OF}</p><h1>지금 확인할 일을,<br className="mobile-break"/> 한눈에.</h1><p className="intro-copy">제품의 진행 상태와 다음 할 일을 연결합니다</p></div><div className="snapshot-note"><span>운영 대시보드</span><strong>기존 데이터 실시간 연동</strong><small>일정은 오늘 기준으로 계산합니다</small></div></section>
 <div className="data-notice"><span className="notice-dot"/><p><strong>오래된 일정부터 확인해 주세요</strong> 지난 날짜는 상태 확인 대상입니다. 확인된 연결 규칙으로 재고를 표시합니다. 야광 1+1만 2개로 환산하며 연결되지 않은 제품은 확인이 필요합니다.</p></div>
 <section className="action-grid" aria-label="확인할 일">{cards.map(c=><button key={c.key} className={`action-card ${c.tone} ${focus===c.key?"chosen":""}`} onClick={()=>setFocus(focus===c.key?"all":c.key)} aria-pressed={focus===c.key}><div className="card-label">{c.label}<span>{c.icon}</span></div><div className="card-number">{c.n}<small>{c.unit}</small></div><p>{c.desc}</p><span className="card-cta">해당 제품 보기 →</span></button>)}</section>
 <section className="portfolio-strip"><div><strong>{prods.length}</strong><span>전체 제품</span></div><div><strong>{prods.filter(p=>p.status==="판매중").length}</strong><span>판매 중</span></div><div><strong>{prods.filter(p=>p.reorder).length}</strong><span>재발주 진행</span></div><div><button className="inventory-count-button" onClick={onInventory} aria-label={`재고 연결 ${prods.length}개 중 ${inventoryConfirmed(prods)}개 확인, 연결 내역 보기`}><strong style={{fontSize:18}}>{inventoryConfirmed(prods)}/{prods.length}</strong><span>재고 연결 확인 ↗</span></button></div><p><button className="inventory-link" onClick={onInventory}>가져온 재고 보기 ↗</button></p></section>
 <div className="section-title"><div><p className="eyebrow">PRODUCT PRIORITIES</p><h2>{focus==="all"?"제품별 다음 액션":cards.find(c=>c.key===focus)?.label+" · 해당 제품"}<span>{filtered.length}</span></h2></div>{focus!=="all"?<button className="text-link" onClick={()=>setFocus("all")}>전체 제품 보기 ↗</button>:<button className="text-link" onClick={onTeam}>팀별 업무 보기 ↗</button>}</div>
 <div className="priority-table"><div className="priority-head"><span>제품 / 진행 상태</span><span>다음 액션</span><span>담당자</span><span>확인할 일정</span><span/></div>{filtered.length===0&&<div className="empty-state">해당 조건에 맞는 일정이 없습니다<small>다른 확인 항목이나 전체 제품을 살펴보세요</small><button onClick={()=>setFocus("all")}>전체 제품 보기</button></div>}{filtered.map((p,i)=>{const open=[...(p.pt||[]),...(p.ct||[]),...(p.mt||[])].filter(t=>!t.done);const t=open[0];const d=p.reorder?.deadline||(p.status!=="판매중"?p.deadline:null);const stale=d&&dl(d)<0;const action=p.inventoryStale?"최근 파일의 누락 재고 행 확인":!p.confirmedInventory||p.stock===null?"원본 재고와 제품 연결 확인":p.status==="판매중"&&p.stock===0?"실재고 및 판매 가능 수량 확인":stale?(p.reorder?"입고 일정 확인":"완료 예정일과 진행 상태 확인"):t?.label||"진행 상태 및 다음 일정 확인";const all=[...(p.pt||[]),...(p.ct||[]),...(p.mt||[])];const done=all.filter(t=>t.done).length;return <button className="priority-row" key={p.id} onClick={()=>onOpen(p)}><div className="product-name"><span className="product-monogram">{String(i+1).padStart(2,"0")}</span><div><strong>{p.name.split(' (')[0]}</strong><small>{displayProductStatus(p.status)}<span>·</span>{p.category||"분류 미정"}</small>{!p.reorder&&<div className="micro-progress"><span style={{width:(all.length?done/all.length*100:0)+"%"}}/></div>}</div></div><div className="next-action"><strong>{action}</strong><small>{p.reorder?`재발주 · ${displayReorderStatus(p.reorder.status)}`:`체크리스트 ${done}/${all.length} 완료 · 미완료 ${open.length}건`}</small></div><div className="owner-cell"><span>{(stale||p.status==="판매중"&&p.stock===0)?"확인 담당 미정":t?.assignee||"담당자 미정"}</span></div><div className="deadline-cell"><strong>{d?d.replaceAll('-','.'):'일정 미정'}</strong><small className={stale?"past":""}>{d?(stale?`기준일 대비 ${Math.abs(dl(d))}일 경과`:`${dl(d)}일 남음`):"일정 등록 필요"}</small></div><span className="row-arrow">↗</span></button>})}</div>
 <div className="overview-footnote"><span>액션은 입력된 상태와 날짜로 제안됩니다. 클릭하면 기존 기획·콘텐츠·마케팅 체크리스트를 확인할 수 있습니다.</span><span>미완료 업무 {pending.length}건</span></div></div>;
}

const taskDateValue=value=>{if(typeof value!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(value))return null;const n=Date.parse(value+"T00:00:00Z");return Number.isFinite(n)&&new Date(n).toISOString().slice(0,10)===value?n:null;};
function pendingProductTasks(p){
 let order=0;return [["pt","기획"],["ct","콘텐츠"],["mt","마케팅"]].flatMap(([type,typeLabel])=>(p[type]||[]).map(task=>({...task,taskType:type,typeLabel,sourceOrder:order++}))).filter(task=>!task.done).sort((a,b)=>{const da=taskDateValue(a.deadline),db=taskDateValue(b.deadline);if(da!==null&&db!==null)return da-db||a.sourceOrder-b.sourceOrder;if(da!==null)return -1;if(db!==null)return 1;return a.sourceOrder-b.sourceOrder;});
}
function nextChecklistTask(p){return pendingProductTasks(p)[0]||null;}
function NextProductTask({product:p,onShowAll}){
 const tasks=pendingProductTasks(p),visible=tasks.slice(0,3);
 if(!tasks.length)return <div className="product-next-task"><strong className="all-tasks-done">미완료 업무 없음</strong><small>상세에서 기존 업무 확인</small><button type="button" className="all-product-tasks" onClick={e=>{e.stopPropagation();onShowAll?.();}}>전체 업무 보기</button></div>;
 return <div className="product-next-task multi-product-tasks" onClick={e=>e.stopPropagation()}><ol aria-label={`${p.name} 다음 업무`}>{visible.map(task=><li key={`${task.taskType}:${task.id}:${task.sourceOrder}`}><strong>{task.label}</strong><div><span className="next-task-type">{task.typeLabel}</span>{task.assignee?<AssigneeSelect value={task.assignee} readOnly/>:<span className="task-no-owner">담당자 미정</span>}</div><small>{taskDateValue(task.deadline)!==null?`기한 ${task.deadline.replaceAll('-','.')}${dl(task.deadline)<0?" · 날짜 확인":""}`:"기한 미정"}</small></li>)}</ol><button type="button" className="all-product-tasks" onClick={e=>{e.stopPropagation();onShowAll?.();}}>전체 업무 보기 · 미완료 {tasks.length}개{tasks.length>3?` (+${tasks.length-3})`:""} ↗</button></div>;
}
const highLevelStatus=status=>status==="입고대기"?"생산중":status;
const displayProductStatus=status=>({"생산중":"생산 중","판매중":"판매 중"}[highLevelStatus(status)]||highLevelStatus(status));
const productionDraft=p=>({status:STAGES.includes(highLevelStatus(p.status))?highLevelStatus(p.status):"",phase:p.production?.phase||"",arrivalExpected:p.production?.arrivalExpected||"",note:p.production?.note||""});
function validateProductionDraft(draft,p){
 if(!STAGES.includes(draft.status))return {error:"진행 상태를 선택해 주세요."};
 const patch={status:draft.status};
 if(["입고대기","발주"].includes(p.status))patch.legacyStatus=p.legacyStatus||p.status;
 if(draft.status==="생산중"){
  if(!["","제작중","배송중"].includes(draft.phase))return {error:"생산 상세 상태를 선택해 주세요."};
  if(draft.arrivalExpected&&taskDateValue(draft.arrivalExpected)===null)return {error:"도착 예정일을 올바른 날짜로 입력해 주세요."};
  patch.production={...(p.production||{}),phase:draft.phase,arrivalExpected:draft.arrivalExpected,note:String(draft.note||"").trim()};
 }
 return {patch};
}
function ProductStageOverview({product:p,onStageApply}) {
 const canEdit=useRole()==="editor";const [draft,setDraft]=useState(()=>productionDraft(p)),[error,setError]=useState("");
 const baseline=JSON.stringify(productionDraft(p));useEffect(()=>{setDraft(productionDraft(p));setError("");},[baseline]);
 const changed=JSON.stringify(draft)!==baseline;

const INITIAL_DASHBOARD_NAV={view:"annual",openId:null,tabMap:{},expandMappings:false,filter:"전체",search:"",sort:"default"};
const createDashboardHistory=initial=>({entries:[{...initial,tabMap:{...(initial.tabMap||{})}}],index:0});
function navigateDashboardHistory(history,patch,replace=false){const current=history.entries[history.index],delta=typeof patch==="function"?patch(current):patch,next={...current,...delta};if(JSON.stringify(next)===JSON.stringify(current))return history;if(replace){const entries=[...history.entries];entries[history.index]=next;return {...history,entries};}return {entries:[...history.entries.slice(0,history.index+1),next],index:history.index+1};}
const stepDashboardHistory=(history,delta)=>({...history,index:Math.max(0,Math.min(history.entries.length-1,history.index+delta))});
function useDashboardNavigation(initial=INITIAL_DASHBOARD_NAV){
 const [history,setHistory]=useState(()=>createDashboardHistory(initial)),[pending,setPending]=useState(false);
 const ref=useRef(history),nativeReady=useRef(false),pendingRef=useRef(false),session=useRef(`peston-nav-${Date.now()}-${Math.random().toString(36).slice(2)}`);ref.current=history;
 const stateFor=index=>({...window.history?.state,pestonNav:{session:session.current,index}});
 const commit=next=>{ref.current=next;setHistory(next);};
 useEffect(()=>{
  try{if(window.history?.replaceState&&window.history?.pushState){window.history.replaceState(stateFor(0),"");nativeReady.current=true;}}catch{nativeReady.current=false;}
  const pop=event=>{const marker=event.state?.pestonNav;pendingRef.current=false;setPending(false);if(marker?.session!==session.current||!Number.isInteger(marker.index)||marker.index<0||marker.index>=ref.current.entries.length)return;commit({...ref.current,index:marker.index});};
  window.addEventListener("popstate",pop);return()=>window.removeEventListener("popstate",pop);
 },[]);
 const navigate=(patch,replace=false)=>{if(pendingRef.current)return;const next=navigateDashboardHistory(ref.current,patch,replace);if(next===ref.current)return;commit(next);if(nativeReady.current){try{window.history[replace?"replaceState":"pushState"](stateFor(next.index),"");}catch{nativeReady.current=false;}}};
 const go=delta=>{if(pendingRef.current)return;const next=stepDashboardHistory(ref.current,delta);if(next.index===ref.current.index)return;const marker=window.history?.state?.pestonNav;if(nativeReady.current&&typeof window.history.go==="function"&&marker?.session===session.current&&marker.index===ref.current.index){pendingRef.current=true;setPending(true);try{window.history.go(delta);return;}catch{nativeReady.current=false;pendingRef.current=false;setPending(false);}}commit(next);};
 return {nav:history.entries[history.index],navigate,replaceNavigation:patch=>navigate(patch,true),goBack:()=>go(-1),goForward:()=>go(1),canGoBack:history.index>0&&!pending,canGoForward:history.index<history.entries.length-1&&!pending};
}

              const isUrg=d!==null&&d>=0&&d<=7;
              const exp=openId===p.id, tab=getTab(p.id);
              const pDone=p.pt.filter(t=>t.done).length, pPct=p.pt.length>0?Math.round((pDone/p.pt.length)*100):0;
              const cDone=p.ct.filter(t=>t.done).length, cPct=p.ct.length>0?Math.round((cDone/p.ct.length)*100):0;
              const mDone=p.mt.filter(t=>t.done).length, mPct=p.mt.length>0?Math.round((mDone/p.mt.length)*100):0;
              return (
                <div key={p.id} hidden={!rows.some(row=>row.id===p.id)} className={`border-b border-gray-100 last:border-0 ${isOver?"bg-red-50/60":isUrg?"bg-amber-50/40":idx%2===1?"bg-gray-50/40":"bg-white"}`}>
                  {/* 메인 행 */}
                  <div className="grid items-center px-5 py-3 cursor-pointer hover:bg-blue-50/20 transition-colors"
                    style={{gridTemplateColumns:"52px 2.5fr 1.7fr 1.25fr 2fr 36px"}}
                    onClick={()=>navigate(current=>({openId:exp?null:p.id,tabMap:!exp&&!current.tabMap[p.id]?{...current.tabMap,[p.id]:"info"}:current.tabMap}))}>

                    {/* 제품 이미지 */}
                    <div onClick={e=>e.stopPropagation()}>
                      <ProductImage image={p.image} name={p.name} size="sm"
                        onChange={v=>setF(p.id,"image",v)}/>
                    </div>

                    {/* 제품명 */}
                    <div className="px-2 min-w-0">
                      <div className="flex items-center gap-1.5 min-w-0">
                        <Editable value={p.name} onChange={v=>setF(p.id,"name",v)} className="font-semibold text-gray-800 text-sm leading-snug" placeholder="제품명"/>
                        {p.url&&<a href={p.url} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()} className="text-blue-400 hover:text-blue-600 flex-shrink-0" title="제품 링크">
                          <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                        </a>}
                      </div>
                      <div className="flex items-center gap-1.5 mt-0.5 flex-wrap">
                        <span className={`text-xs px-1.5 py-0.5 rounded ${SCFG[p.status]?.lt||"bg-gray-100"} ${SCFG[p.status]?.tx||"text-gray-600"}`}>{p.category}</span>

                      </div>
                    </div>

                    {/* 파이프라인 */}
                    <div className="pr-2"><ProductStageOverview product={p} onStageApply={patch=>upd(p.id,old=>({...old,...patch}))}/></div>

                    {/* 재고 */}
                    <div>
                      <div className="flex items-baseline gap-1">
                        <span className={`text-xl font-bold tabular-nums leading-none ${p.stock===null||p.stock===0?"text-gray-400":p.stock<100?"text-amber-600":"text-emerald-600"}`}>
                          {role==="editor"?<EditNum value={p.stock??0} min={0} max={99999999} onChange={v=>setF(p.id,"stock",v)}/>:<span style={{fontSize:p.confirmedInventory?20:12}}>{p.confirmedInventory?invNum(p.stock):"연결 미확정"}</span>}
                        </span>
                        </div><span className="stock-source-label">{p.inventoryStale?"이전값 · 최근 파일에 원본 행 없음":p.confirmedInventory?(p.confirmedInventory.formula||"원본 가용재고 · 상품 단위 유지"):`이전값 ${(p.legacyStock??p.stock)?.toLocaleString()} · 이전 저장값`}</span>

                    </div>

                    {/* 다음 업무: 원본 미완료 체크리스트의 첫 항목 */}
                    <NextProductTask product={p} onShowAll={()=>navigate(current=>({view:"products",openId:p.id,tabMap:{...current.tabMap,[p.id]:"readiness"}}))}/>

                    {/* 컨트롤 */}
                    <div className="flex items-center justify-end gap-0.5" onClick={e=>e.stopPropagation()}>
                      {role==="editor"&&(
                        <div className="flex flex-col gap-0.5 mr-0.5">
                          <button onClick={()=>moveProd(prodIdx,-1)} disabled={prodIdx===0}
                            className={`text-gray-300 hover:text-blue-400 p-0.5 rounded text-xs leading-none ${prodIdx===0?"opacity-30 cursor-not-allowed":""}`} title="위로">▲</button>
                          <button onClick={()=>moveProd(prodIdx,1)} disabled={prodIdx===prods.length-1}
                            className={`text-gray-300 hover:text-blue-400 p-0.5 rounded text-xs leading-none ${prodIdx===prods.length-1?"opacity-30 cursor-not-allowed":""}`} title="아래로">▼</button>
                        </div>
                      )}
                      {role==="editor"&&<button onClick={e=>{e.stopPropagation();delProd(p.id);}} className="p-1 text-gray-300 hover:text-red-400 transition-colors rounded" title="제품 삭제">
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                      </button>}
                      <svg className={`w-4 h-4 text-gray-400 transition-transform ${exp?"rotate-180":""}`} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7"/>
                      </svg>
                    </div>
                  </div>

                  {/* 확장 패널 */}
                  <div hidden={!exp} className="border-t border-blue-100 bg-slate-50/80 px-5 py-4" onClick={e=>e.stopPropagation()}>
                      <details className="launch-history"><summary>전체 진행 단계 보기</summary><div><PipelineBar status={p.status}/></div></details>
                      <nav className="product-detail-nav" aria-label={`${p.name} 상세 메뉴`}>
                        {[["info","제품 정보","이름·가격·운영 정보"],["readiness","출시 준비",`${p.pt.filter(t=>!t.done).length+p.ct.filter(t=>!t.done).length+p.mt.filter(t=>!t.done).length}개 업무 남음`],["reorder","재발주",p.reorder?displayReorderStatus(p.reorder.status):"진행 중인 재발주 없음"]].map(([key,label,subtitle])=><button key={key} type="button" className={tab===key?"selected":""} aria-pressed={tab===key} onClick={()=>setTab(p.id,key)}><strong>{label}</strong><span>{subtitle}</span></button>)}
                      </nav>
                      <div hidden={tab!=="readiness"}><LaunchReadiness product={p} onUpdate={(type,fn)=>updTask(p.id,type,fn)} onGroupUpdate={(type,meta)=>updGroupMeta(p.id,type,meta)}/></div>

                      {tab==="reorder"&&(
                        <div>
                          {p.reorder
                            ?<div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div className="bg-white rounded-lg border border-gray-200 p-4">
                                  <p className="text-xs text-gray-500 mb-1">재발주 수량</p>
                                  <p className="text-2xl font-bold text-indigo-600"><EditNum value={p.reorder.qty} min={0} max={99999} suffix="개" onChange={v=>setRF(p.id,"qty",v)}/></p>
                                </div>
                                <div className="bg-white rounded-lg border border-gray-200 p-4">
                                  <p className="text-xs text-gray-500 mb-2">현재 단계</p>
                                  <select className="text-sm border border-gray-200 rounded-lg px-2 py-1.5 w-full focus:outline-none" disabled={role!=="editor"}
                                    value={p.reorder.status} onChange={e=>setRF(p.id,"status",e.target.value)}>
                                    {["발주완료","생산중","입고대기"].map(s=><option key={s}>{s}</option>)}
                                  </select>
                                </div>
                                <div className="bg-white rounded-lg border border-gray-200 p-4">
                                  <p className="text-xs text-gray-500 mb-1">입고 예정일</p>
                                  <input type="date" className="text-sm border border-gray-200 rounded-lg px-2 py-1.5 w-full focus:outline-none" disabled={role!=="editor"}
                                    value={p.reorder.deadline} onChange={e=>setRF(p.id,"deadline",e.target.value)}/>
                                  {p.reorder.deadline&&<p className="text-xs text-indigo-500 mt-1">{dl(p.reorder.deadline)<0?`D+${Math.abs(dl(p.reorder.deadline))}`:`D-${dl(p.reorder.deadline)}`}</p>}
                                </div>
                                {role==="editor"&&<div className="sm:col-span-3 flex justify-end">
                                  <button onClick={()=>setF(p.id,"reorder",null)} className="text-xs text-red-400 hover:text-red-600 px-3 py-1.5 border border-red-200 rounded-lg hover:bg-red-50">재발주 취소</button>
                                </div>}
                              </div>
                            :<div className="text-center py-8 space-y-3">
                                <p className="text-gray-400 text-sm">재발주 정보가 없습니다.</p>
                                {role==="editor"&&<button onClick={()=>{setF(p.id,"reorder",{qty:0,deadline:"",status:"발주완료"});setTab(p.id,"reorder");}}
                                  className="px-4 py-2 bg-indigo-600 text-white text-sm rounded-lg hover:bg-indigo-700 shadow-sm">🔄 재발주 등록하기</button>}
                              </div>
                          }
                        </div>
                      )}

                      <div hidden={tab!=="info"}><ProductInfoPanel product={p} draftState={infoDrafts[p.id]} onDraftChange={next=>setInfoDrafts(d=>({...d,[p.id]:typeof next==="function"?next(d[p.id]):next}))} onApply={patch=>upd(p.id,old=>({...old,...patch,...(["입고대기","발주"].includes(old.status)&&patch.status!==old.status?{legacyStatus:old.legacyStatus||old.status}:{})}))}/></div>

                    </div>
                </div>
              );
            })}
          </div></div>
          </section>

        <section hidden={view!=="inventory"} data-screen="inventory"><InventoryView prods={prods} inventory={inventory} expandMappings={expandMappings} onApply={next=>{if(role!=="editor")return;setProds(next.prods);setInventory(next.inventory);setDirty(true);}}/></section>
        <section hidden={view!=="team"} data-screen="team"><TeamView prods={prods} onEditMember={editMember} onSetTaskDone={setTeamTaskDone}/></section>

        <footer className="preview-footer">PESTON / OPERATIONS <span>변경은 이 화면에서만 반영 · 일정 기준일 {AS_OF}</span></footer>
      </div>
    </div>
    </MembersCtx.Provider>
    </RoleCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
