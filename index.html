const STAGES = ["기획","발주","생산중","입고대기","판매중"];
const PAL = [
  {dot:"bg-blue-500",    bd:"bg-blue-50 text-blue-700 border-blue-200",    hex:"#3b82f6"},
  {dot:"bg-indigo-500",  bd:"bg-indigo-50 text-indigo-700 border-indigo-200",  hex:"#6366f1"},
  {dot:"bg-violet-500",  bd:"bg-violet-50 text-violet-700 border-violet-200",  hex:"#8b5cf6"},
  {dot:"bg-rose-500",    bd:"bg-rose-50 text-rose-700 border-rose-200",    hex:"#f43f5e"},
  {dot:"bg-pink-500",    bd:"bg-pink-50 text-pink-700 border-pink-200",    hex:"#ec4899"},
  {dot:"bg-orange-500",  bd:"bg-orange-50 text-orange-700 border-orange-200",  hex:"#f97316"},
  {dot:"bg-emerald-500", bd:"bg-emerald-50 text-emerald-700 border-emerald-200",hex:"#10b981"},
  {dot:"bg-amber-500",   bd:"bg-amber-50 text-amber-700 border-amber-200",   hex:"#f59e0b"},
  {dot:"bg-teal-500",    bd:"bg-teal-50 text-teal-700 border-teal-200",    hex:"#14b8a6"},
  {dot:"bg-cyan-500",    bd:"bg-cyan-50 text-cyan-700 border-cyan-200",    hex:"#06b6d4"},
];
const MEMBER_COLORS = [
  "bg-blue-500","bg-emerald-500","bg-violet-500","bg-rose-500",
  "bg-amber-500","bg-teal-500","bg-pink-500","bg-indigo-500",
  "bg-red-500","bg-orange-500","bg-cyan-500","bg-sky-500",
  "bg-lime-500","bg-fuchsia-500","bg-green-500","bg-slate-500",
];
const SCFG = {
  기획:    {bg:"bg-gray-500",    lt:"bg-gray-100",    tx:"text-gray-600",    rg:"ring-gray-400"},
  발주:    {bg:"bg-indigo-500",  lt:"bg-indigo-50",   tx:"text-indigo-700",  rg:"ring-indigo-400"},
  생산중:  {bg:"bg-blue-500",    lt:"bg-blue-50",     tx:"text-blue-700",    rg:"ring-blue-400"},
  입고대기:{bg:"bg-amber-500",   lt:"bg-amber-50",    tx:"text-amber-700",   rg:"ring-amber-400"},
  판매중:  {bg:"bg-emerald-500", lt:"bg-emerald-50",  tx:"text-emerald-700", rg:"ring-emerald-400"},

const displayReorderStatus = s => ({"발주완료":"발주 완료","생산중":"생산 중","입고대기":"입고 대기"}[s]||s);

const RCFG = { 발주완료:"bg-indigo-100 text-indigo-700", 생산중:"bg-blue-100 text-blue-600", 입고대기:"bg-amber-100 text-amber-700" };

/* ══ HELPERS ══ */
let _id = 0;
const uid  = () => `u${++_id}`;
const gc   = g => { let h=0; for(const c of String(g||"")) h=(h*31+c.charCodeAt(0))&255; return PAL[h%PAL.length]; };
const mc   = name => { let h=0; for(const c of String(name||"")) h=(h*31+c.charCodeAt(0))&255; return MEMBER_COLORS[h%MEMBER_COLORS.length]; };
const AS_OF=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Seoul"}); const dl = d => d && /^\d{4}-\d{2}-\d{2}$/.test(d) ? Math.round((Date.parse(d+"T00:00:00Z")-Date.parse(AS_OF+"T00:00:00Z"))/86400000) : null;
const si   = s => STAGES.indexOf(s);
const mkT  = (label, group, done=false, subs=[]) => ({
  id:uid(), label, group, done, open:false, assignee:null, deadline:null,
  subtasks: subs.map(([l,d])=>({id:uid(),label:l,done:d||false}))
});
const getmc = (name, memberColors) => memberColors[name] || mc(name);
const getGroupColorIdx = (grp, groupMeta) => {
  if (groupMeta?.[grp]?.colorIdx !== undefined) return groupMeta[grp].colorIdx;
  let h=0; for(const c of String(grp||"")) h=(h*31+c.charCodeAt(0))&255;
  return h % PAL.length;
};

/* ══ IMAGE COMPRESSION ══ */
const compressImage = (dataUrl, maxSize=200, quality=0.75) => new Promise(resolve => {
  const img = new Image();
  img.onload = () => {
    const scale = Math.min(maxSize/img.width, maxSize/img.height, 1);
    const canvas = document.createElement('canvas');
    canvas.width  = Math.round(img.width  * scale);
    canvas.height = Math.round(img.height * scale);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    resolve(canvas.toDataURL('image/jpeg', quality));
  };
  img.onerror = () => resolve(dataUrl);
  img.src = dataUrl;
});

function MiniBar({v}) {
  const c = v>=100?"bg-gray-400":v>=60?"bg-blue-500":v>=30?"bg-amber-400":"bg-red-400";
  return (
    <div className="flex items-center gap-1.5">

      </div>
      <span className="text-xs text-gray-500 w-7 text-right tabular-nums">{v}%</span>
    </div>
  );
}

function Editable({value, onChange, className="", placeholder="클릭하여 입력"}) {
  const canEdit = useRole() === "editor";
  const [ed, setEd] = useState(false);
  const [draft, setDraft] = useState(value);
  const commit = () => { onChange(draft.trim()||value); setEd(false); };
  if (!canEdit) return <span className={className}>{value||<span className="text-gray-400 italic text-xs">{placeholder}</span>}</span>;
  if (ed) return (
    <input autoFocus value={draft} placeholder={placeholder}
      className="border-b-2 border-blue-400 bg-transparent focus:outline-none w-full min-w-16"
      style={{fontSize:"inherit",fontWeight:"inherit"}}
      onChange={e=>setDraft(e.target.value)}
      onBlur={commit}
      onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape"){setDraft(value);setEd(false);}}}
    />
  );
  return (
    <span className={`group/ed inline-flex items-center gap-1 ${className}`}
      onDoubleClick={e=>{e.stopPropagation();setDraft(value);setEd(true);}}>
      <span>{value||<span className="text-gray-400 italic text-xs">{placeholder}</span>}</span>
      <button className="opacity-0 group-hover/ed:opacity-50 hover:!opacity-100 text-gray-400 hover:text-blue-500 text-xs"
        onClick={e=>{e.stopPropagation();setDraft(value);setEd(true);}}>✏️</button>
    </span>
  );
}

function EditNum({value, min=0, max=999999, suffix="", onChange}) {
  const canEdit = useRole() === "editor";
  const [ed, setEd] = useState(false);
  const [draft, setDraft] = useState(value);
  const commit = () => { onChange(Math.min(max,Math.max(min,Number(draft)||0))); setEd(false); };
  if (!canEdit) return <span className="tabular-nums">{value}{suffix}</span>;
  if (ed) return (
    <input autoFocus type="number" value={draft} min={min} max={max}
      className="w-14 border border-blue-400 rounded px-1 text-sm text-center focus:outline-none"
      onChange={e=>setDraft(e.target.value)} onBlur={commit}
      onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape")setEd(false);}}
    />
  );
  return <span className="cursor-pointer hover:text-blue-600 hover:underline" title="클릭 수정"
    onClick={e=>{e.stopPropagation();setDraft(value);setEd(true);}}>{value}{suffix}</span>;
}

function AddInput({placeholder, onAdd, onCancel}) {
  const [v, setV] = useState("");
  const go = () => { if(v.trim()) onAdd(v.trim()); else onCancel(); };
  return (
    <div className="flex items-center gap-1 mt-1.5" onClick={e=>e.stopPropagation()}>
      <input autoFocus value={v} placeholder={placeholder}
        className="flex-1 text-xs border border-blue-300 rounded-lg px-2 py-1 focus:outline-none focus:ring-1 focus:ring-blue-400"
        onChange={e=>setV(e.target.value)}
        onKeyDown={e=>{if(e.key==="Enter")go();if(e.key==="Escape")onCancel();}}
      />
      <button onClick={go} className="text-xs bg-blue-500 text-white px-2 py-1 rounded-lg hover:bg-blue-600 flex-shrink-0">추가</button>
      <button onClick={onCancel} className="text-xs text-gray-400 hover:text-gray-600 px-1">✕</button>
    </div>
  );
}

function ProductImage({image, name, size="sm", onChange}) {
  const canEdit = useRole() === "editor";
  const fileRef = useRef();
  const sz = size==="lg" ? "w-28 h-28 rounded-xl text-3xl" : size==="md" ? "w-16 h-16 rounded-lg text-2xl" : "w-10 h-10 rounded-lg text-base";
  const handleFile = e => {
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      compressImage(ev.target.result, 200, 0.75).then(onChange);
    };
    reader.readAsDataURL(f);
    e.target.value = "";
  };
  return (
    <div className={`relative flex-shrink-0 group/img ${sz} overflow-hidden bg-gray-100 flex items-center justify-center`}
      style={{cursor: canEdit ? "pointer" : "default"}}
      onClick={e=>{ if(canEdit){e.stopPropagation();fileRef.current?.click();} }}>
      {image
        ? <img src={image} alt={name} className="w-full h-full object-cover"/>
        : <span className="select-none">📦</span>
      }
      {canEdit && (
        <div className="absolute inset-0 bg-black/40 opacity-0 group-hover/img:opacity-100 transition-opacity flex flex-col items-center justify-center gap-0.5">
          <span className="text-white text-xs font-medium leading-tight">{image?"변경":"사진추가"}</span>
          {image && <button className="text-red-300 hover:text-red-400 text-xs leading-tight"
            onClick={e=>{e.stopPropagation();onChange(null);}}>✕삭제</button>}
        </div>
      )}
      <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleFile}/>
    </div>
  );
}

    <div className="relative flex-shrink-0" onClick={e=>e.stopPropagation()}>

          ${value ? `text-white ${color}` : "text-gray-400 border border-dashed border-gray-300 hover:border-blue-400 hover:text-blue-400"}`}>
        {value ? <span>{value}</span> : <span>담당자</span>}

/* ── D-day 태스크 마감일 ── */
function TaskDeadlinePill({value, onChange, done=false}) {
  const canEdit = useRole() === "editor";
  const [editing, setEditing] = useState(false);
  const today = new Date(); today.setHours(0,0,0,0);
  const d = value ? dl(value) : null;
  const label = d===null?null:d<0?`D+${Math.abs(d)}`:(d<0?`D+${Math.abs(d)}`:`D-${d}`);
  const color = d===null?""
    :d<0?"bg-red-100 text-red-600 border-red-200"
    :d===0?"bg-red-50 text-red-500 border-red-200"
    :d<=3?"bg-orange-100 text-orange-600 border-orange-200"
    :d<=7?"bg-amber-100 text-amber-600 border-amber-200"
    :"bg-gray-100 text-gray-500 border-gray-200";
  if(done)return value?<span className="text-xs px-1.5 py-0.5 rounded-full border border-gray-200 bg-gray-50 text-gray-500" title={`완료된 업무의 기한: ${value}`}>{value} · 완료</span>:null;
  if (!canEdit) {
    if (!value) return null;
    return <span className={`text-xs px-1.5 py-0.5 rounded-full border font-medium flex-shrink-0 ${color}`} title={value}>{label}</span>;
  }
  if (editing) return (
    <input type="date" autoFocus value={value||""}
      className="text-xs border border-blue-300 rounded-lg px-1.5 py-0.5 focus:outline-none focus:ring-1 focus:ring-blue-400 flex-shrink-0"
      style={{width:"7.5rem"}}
      onChange={e=>onChange(e.target.value||null)} onBlur={()=>setEditing(false)}
      onKeyDown={e=>{if(e.key==="Escape")setEditing(false);}} onClick={e=>e.stopPropagation()}/>
  );
  return value
    ? <button onClick={e=>{e.stopPropagation();setEditing(true);}}
        className={`text-xs px-1.5 py-0.5 rounded-full border font-medium flex-shrink-0 transition-opacity hover:opacity-75 ${color}`}
        title={`마감일: ${value}`}>{label}</button>
    : <button onClick={e=>{e.stopPropagation();setEditing(true);}}
        className="opacity-0 group-hover/task:opacity-60 hover:!opacity-100 text-gray-400 hover:text-blue-500 text-xs flex-shrink-0 px-0.5"
        title="D-day 설정">📅</button>;
}

function TaskRow({task, onToggle, onDelete, onRename, onToggleOpen, onAddSub, onToggleSub, onDeleteSub, onRenameSub, onAssign, onSetDeadline}) {

          className={`text-xs flex-1 min-w-0 ${task.done?"line-through text-gray-500":"text-gray-700"}`} placeholder="태스크 이름"/>

            className="text-xs text-gray-400 hover:text-gray-600 flex-shrink-0 bg-gray-100 rounded px-1 py-0.5">

            <button onClick={e=>{e.stopPropagation();onDelete();}} className="text-red-300 hover:text-red-500 text-xs px-1 py-0.5 rounded hover:bg-red-50" title="삭제">✕</button>
          </span>

          {addingSub&&<div className="pl-5"><AddInput placeholder="하위 태스크 이름..." onAdd={l=>{onAddSub(l);setAddingSub(false);}} onCancel={()=>setAddingSub(false)}/></div>}

function TaskPanel({tasks, groupMeta={}, onUpdate, onUpdateGroupMeta}) {
  const canEdit = useRole() === "editor";
  const [addingTo, setAddingTo] = useState(null);
  const [newGroup, setNewGroup] = useState(false);
  const [newGroupName, setNewGroupName] = useState("");
  const [editingGroup, setEditingGroup] = useState(null);
  const [groupDraft, setGroupDraft] = useState({name:"", colorIdx:0});

  const up   = fn => onUpdate(fn);
  const toggleTask  = tid => up(ts=>ts.map(t=>t.id===tid?{...t,done:!t.done}:t));
  const deleteTask  = tid => up(ts=>ts.filter(t=>t.id!==tid));
  const renameTask  = (tid,l) => up(ts=>ts.map(t=>t.id===tid?{...t,label:l}:t));
  const toggleOpen  = tid => up(ts=>ts.map(t=>t.id===tid?{...t,open:!t.open}:t));
  const addTask     = (label,group) => { up(ts=>[...ts,mkT(label,group)]); setAddingTo(null); };
  const assignTask  = (tid,assignee) => up(ts=>ts.map(t=>t.id===tid?{...t,assignee}:t));
  const setDeadline = (tid,deadline) => up(ts=>ts.map(t=>t.id===tid?{...t,deadline}:t));
  const addSub      = (tid,l) => up(ts=>ts.map(t=>t.id===tid?{...t,open:true,subtasks:[...t.subtasks,{id:uid(),label:l,done:false}]}:t));
  const toggleSub   = (tid,sid) => up(ts=>ts.map(t=>t.id===tid?{...t,subtasks:t.subtasks.map(s=>s.id===sid?{...s,done:!s.done}:s)}:t));
  const deleteSub   = (tid,sid) => up(ts=>ts.map(t=>t.id===tid?{...t,subtasks:t.subtasks.filter(s=>s.id!==sid)}:t));
  const renameSub   = (tid,sid,l) => up(ts=>ts.map(t=>t.id===tid?{...t,subtasks:t.subtasks.map(s=>s.id===sid?{...s,label:l}:s)}:t));

  const startEditGroup = (grp) => {
    const cidx = getGroupColorIdx(grp, groupMeta);
    setGroupDraft({name: grp, colorIdx: cidx});
    setEditingGroup(grp);
  };
  const commitGroupEdit = () => {
    const oldName = editingGroup;
    const {name: newName, colorIdx} = groupDraft;
    if(!newName.trim()) return;
    // rename tasks
    if(newName !== oldName) up(ts=>ts.map(t=>t.group===oldName?{...t,group:newName}:t));
    // update groupMeta
    if(onUpdateGroupMeta) {
      const newMeta = {...groupMeta};
      newMeta[newName] = {colorIdx};
      if(newName !== oldName) delete newMeta[oldName];
      onUpdateGroupMeta(newMeta);
    }
    setEditingGroup(null);
  };

  const groups = [...new Set(tasks.map(t=>t.group))];
  const done = tasks.filter(t=>t.done).length;
  const pct  = tasks.length>0?Math.round((done/tasks.length)*100):0;
  const handleNewGroup = () => { if(newGroupName.trim()){ addTask("새 태스크",newGroupName.trim()); setNewGroup(false); setNewGroupName(""); }};

  return (
    <div className="space-y-4" onClick={e=>e.stopPropagation()}>
      <div className="flex items-center gap-3">
        <div className="flex-1"><MiniBar v={pct}/></div>
        <span className="text-xs text-gray-400 flex-shrink-0">{done}/{tasks.length} 완료</span>
      </div>
      {groups.map(grp=>{
        const grpTasks=tasks.filter(t=>t.group===grp), gDone=grpTasks.filter(t=>t.done).length;
        const col=getGroupCol(grp, groupMeta);
        const isAdding=addingTo===grp;
        const isEditing=editingGroup===grp;
        return (
          <div key={grp} className="bg-white rounded-lg border border-gray-100 p-3 space-y-2">
            <div className="flex items-center justify-between">
              {isEditing ? (
                <div className="flex items-center gap-2 flex-1" onClick={e=>e.stopPropagation()}>
                  {/* 색상 선택 */}
                  <div className="flex gap-1 flex-wrap">
                    {PAL.map((p,i)=>(
                      <button key={i} onClick={()=>setGroupDraft(d=>({...d,colorIdx:i}))}
                        className={`w-5 h-5 rounded-full ${p.dot} transition-all hover:scale-110 ${groupDraft.colorIdx===i?"ring-2 ring-offset-1 ring-gray-500 scale-110":""}`}/>
                    ))}
                  </div>
                  <input autoFocus value={groupDraft.name}
                    className="border border-blue-300 rounded-lg px-2 py-0.5 text-xs focus:outline-none focus:ring-1 focus:ring-blue-400 w-28"
                    onChange={e=>setGroupDraft(d=>({...d,name:e.target.value}))}
                    onKeyDown={e=>{if(e.key==="Enter")commitGroupEdit();if(e.key==="Escape")setEditingGroup(null);}}
                  />
                  <button onClick={commitGroupEdit} className="text-xs bg-blue-500 text-white px-2 py-0.5 rounded-lg hover:bg-blue-600">저장</button>
                  <button onClick={()=>setEditingGroup(null)} className="text-xs text-gray-400 px-1">✕</button>
                </div>
              ) : (
                <span className={`text-xs font-medium px-2 py-0.5 rounded-full border inline-flex items-center gap-1.5 ${gDone===grpTasks.length?"bg-gray-50 border-gray-200 text-gray-500":col.bd}`}>
                  <span className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${gDone===grpTasks.length?"bg-gray-300":col.dot}`}/>{grp}
                  <span className="text-gray-400 font-normal">{gDone}/{grpTasks.length}</span>
                  {canEdit&&<button onClick={e=>{e.stopPropagation();startEditGroup(grp);}}
                    className="opacity-60 hover:opacity-100 text-xs ml-0.5" title="그룹 편집">✏️</button>}
                </span>
              )}
              {canEdit&&!isEditing&&<button onClick={()=>setAddingTo(isAdding?null:grp)} className="text-xs text-blue-400 hover:text-blue-600 hover:bg-blue-50 px-1.5 py-0.5 rounded">+ 태스크</button>}
            </div>
            <div className="space-y-0.5 pl-0.5">
              {grpTasks.map(t=>(
                <TaskRow key={t.id} task={t}
                  onToggle={()=>toggleTask(t.id)} onDelete={()=>deleteTask(t.id)} onRename={l=>renameTask(t.id,l)}
                  onToggleOpen={()=>toggleOpen(t.id)} onAssign={a=>assignTask(t.id,a)}
                  onSetDeadline={d=>setDeadline(t.id,d)}
                  onAddSub={l=>addSub(t.id,l)} onToggleSub={sid=>toggleSub(t.id,sid)}
                  onDeleteSub={sid=>deleteSub(t.id,sid)} onRenameSub={(sid,l)=>renameSub(t.id,sid,l)}/>
              ))}
            </div>
            {canEdit&&isAdding&&<AddInput placeholder="새 태스크 이름..." onAdd={l=>addTask(l,grp)} onCancel={()=>setAddingTo(null)}/>}
          </div>
        );
      })}
      {canEdit&&(
        <div className="border-t border-dashed border-gray-200 pt-2">
          {newGroup
            ?<div className="flex items-center gap-1.5">
              <input autoFocus value={newGroupName} placeholder="새 그룹 이름..."
                className="flex-1 text-xs border border-blue-300 rounded-lg px-2 py-1.5 focus:outline-none"
                onChange={e=>setNewGroupName(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter")handleNewGroup();if(e.key==="Escape"){setNewGroup(false);setNewGroupName("");}}}
              />
              <button onClick={handleNewGroup} className="text-xs bg-blue-500 text-white px-2 py-1.5 rounded-lg hover:bg-blue-600">생성</button>
              <button onClick={()=>{setNewGroup(false);setNewGroupName("");}} className="text-xs text-gray-400 px-1">✕</button>
            </div>
            :<button onClick={()=>setNewGroup(true)} className="text-xs text-gray-400 hover:text-blue-500 flex items-center gap-1 py-1 hover:bg-blue-50 px-2 rounded-lg w-full"><span className="text-base leading-none">＋</span> 새 그룹 추가</button>
          }
        </div>
      )}
    </div>
  );
}

function TeamView({prods, onEditMember}) {
  const canEdit = useRole() === "editor";
  const { members, setMembers, memberColors } = useMembers();
  const [selected, setSelected] = useState("전체");
  const [addingMember, setAddingMember] = useState(false);
  const [editingMember, setEditingMember] = useState(null);

  const allTasks = useMemo(() => prods.flatMap(p=>[
    ...p.pt.map(t=>({...t, product:p.name, productId:p.id, typeLabel:"기획"})),
    ...p.ct.map(t=>({...t, product:p.name, productId:p.id, typeLabel:"콘텐츠"})),
    ...p.mt.map(t=>({...t, product:p.name, productId:p.id, typeLabel:"마케팅"})),
  ]),[prods]);

  const byMember = useMemo(()=> members.reduce((acc,m)=>{ acc[m]=allTasks.filter(t=>t.assignee===m); return acc; },{}), [allTasks,members]);
  const unassigned = useMemo(()=>allTasks.filter(t=>!t.assignee),[allTasks]);
  const display = selected==="전체" ? members : [selected];

  const handleAddMember = name => { const u=[...members,name]; setMembers(u); saveMembers(u); setAddingMember(false); };
  const handleDelMember = m => { if(window.confirm(`"${m}" 팀원을 삭제하시겠습니까?`)){ const u=members.filter(x=>x!==m); setMembers(u); saveMembers(u); }};

  return (
    <div className="space-y-5">
      {editingMember&&<MemberEditModal name={editingMember} onSave={(n,c)=>handleSaveMember(editingMember,n,c)} onClose={()=>setEditingMember(null)}/>}

        <span className="text-xs font-semibold text-gray-500 uppercase tracking-wide">팀원 필터</span>
        <div className="flex flex-wrap gap-1.5">
          {["전체",...members].map(m=>{
            const tasks=m==="전체"?null:byMember[m]||[];

              <div key={m} className="flex items-center gap-0.5">

                  {m!=="전체"&&<span className={`w-2 h-2 rounded-full flex-shrink-0 ${active?"bg-white/70":mColor}`}/>}

              </div>

                  <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">🔴 미완료</p>
                  {pending.map(t=>{

                        <div className="min-w-0 flex-1">
                          <div className="flex items-center gap-1.5 flex-wrap">
                            <p className="text-xs text-gray-700 leading-snug">{t.label}</p>

                          </div>
                          <p className="text-xs text-gray-400 truncate">{t.product} <span className="text-gray-300">·</span> {t.typeLabel}</p>

                      </div>

                <div className="px-4 pb-3 border-t border-gray-50">
                  <details className="group">
                    <summary className="text-xs text-gray-400 cursor-pointer pt-2 hover:text-gray-600 list-none flex items-center gap-1">
                      <span className="group-open:rotate-90 inline-block transition-transform">▶</span>

                    </summary>
                    <div className="mt-1.5 space-y-1 max-h-36 overflow-y-auto">
                      {completed.map(t=>(
                        <div key={t.id} className="flex items-start gap-2">
                          <span className="w-1.5 h-1.5 rounded-full mt-1.5 flex-shrink-0 bg-gray-300"/>
                          <div className="min-w-0">
                            <p className="text-xs text-gray-500 line-through leading-snug">{t.label}</p>
                            <p className="text-xs text-gray-300 truncate">{t.product}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </details>
                </div>

            </div>
          );
        })}
      </div>
    </div>
  );
}

 const updated=prods.map(p=>{const rule=inventory.mappingRules.find(r=>r.dashboardProductId===p.id&&p.name.includes(r.dashboardProductCode));if(!rule)return p;const match=resolveInventoryRule(rule,rows);if(!match){changes.push({id:p.id,name:p.name,old:p.stock,next:null,status:"missing",detail:"연결된 원본 행 누락 · 이전값 유지(최신 아님)"});next.mapping[String(p.id)]={...next.mapping[String(p.id)],candidates:[],note:"최근 파일에 연결된 원본 행이 없습니다. 이전 수량을 참고값으로 유지합니다."};return {...p,inventoryStale:true};}if(!Number.isSafeInteger(match.available))throw Error(p.name+": 환산 수량이 정수 범위를 벗어났습니다.");const sources=match.sources.map(x=>({sourceRow:x.row.id,sourceName:x.row.name,multiplier:x.multiplier,available:x.row.available}));const formula=sources.length>1?sources.map(x=>`${invNum(x.available)}${x.multiplier!==1?` × ${x.multiplier}`:""}`).join(" + ")+` = ${invNum(match.available)}개`:null;next.mapping[String(p.id)]={...next.mapping[String(p.id)],confirmedSourceRows:sources.map(x=>x.sourceRow),candidates:sources.map(x=>x.sourceRow)};changes.push({id:p.id,name:p.name,old:p.stock,next:match.available,status:"ready",detail:formula||"원본 상품 단위 유지"});return {...p,stock:match.available,inventoryStale:false,confirmedInventory:{...p.confirmedInventory,sourceName:sources.map(x=>x.sourceName).join(" + "),sourceRow:sources[0].sourceRow,sourceRows:sources.map(x=>x.sourceRow),sources,normal:match.sources.reduce((n,x)=>n+x.row.normal*x.multiplier,0),available:match.available,defective:match.sources.reduce((n,x)=>n+x.row.defective*x.multiplier,0),formula}};});

function InventoryImport({prods,inventory,onApply}){
 const canEdit=useRole()==="editor";
 const [staged,setStaged]=useState(null),[error,setError]=useState(""),[busy,setBusy]=useState(false),[acceptOlder,setAcceptOlder]=useState(false),[message,setMessage]=useState("");const generation=useRef(0);
 const choose=async e=>{const file=e.target.files?.[0];e.target.value="";if(!file)return;const request=++generation.current;setError("");setMessage("");setStaged(null);setAcceptOlder(false);setBusy(true);try{if(!/\.xls$/i.test(file.name))throw Error("현재 이지어드민에서 내려받은 HTML 형식 .xls만 지원합니다. .xlsx·일반 바이너리 .xls는 지원하지 않습니다.");if(file.size>5*1024*1024)throw Error("5MB 이하 파일을 선택해 주세요.");const bytes=await file.arrayBuffer();let text;try{text=new TextDecoder("utf-8",{fatal:true}).decode(bytes);}catch{throw Error("HTML 형식 UTF-8 .xls 파일이 아닙니다. 이지어드민에서 현재고조회 파일을 다시 내려받아 주세요.");}const rows=parseInventoryHTML(text);const next=buildInventoryImport(rows,file.name,prods,inventory);next.baseline=JSON.stringify({prods,inventory});if(request===generation.current)setStaged(next);}catch(err){if(request===generation.current)setError(err.message);}finally{if(request===generation.current)setBusy(false);}};
 const cancel=()=>{generation.current++;setBusy(false);setStaged(null);setError("");setAcceptOlder(false);};
 const apply=()=>{if(!canEdit||!staged||staged.older&&!acceptOlder)return;if(staged.baseline!==JSON.stringify({prods,inventory})){setError("검토 중 데이터가 변경됐습니다. 파일을 다시 선택하여 최신 변경 내역을 확인해 주세요.");setStaged(null);return;}onApply(staged);setStaged(null);setMessage("화면에 반영했습니다. 상단 저장을 누르면 연결된 제품의 재고만 기존 대시보드에 저장됩니다. 나머지 원본 행은 전송하지 않습니다.");};

 return <section className="inventory-import"><div><strong>재고 엑셀 업데이트</strong><p>파일 선택 → 변경 확인 → 화면 반영 → 상단 저장</p></div><label className="import-file">.xls 파일 선택<input type="file" accept=".xls" onChange={choose} aria-label="이지어드민 재고 파일 선택" disabled={!canEdit}/></label><small>이지어드민 HTML 형식 .xls 지원 · .xlsx/일반 바이너리 .xls 미지원 · 파일 전체는 외부로 전송하지 않습니다. 저장 시 연결된 제품 행만 동기화합니다</small>{!canEdit&&<p>재고 업데이트는 기존 편집 모드를 켠 뒤 사용할 수 있습니다.</p>}{busy&&<p role="status">파일 확인 중… <button onClick={cancel}>취소</button></p>}{error&&<p className="import-error" role="alert">{error}</p>}{message&&<p className="import-success" role="status">{message}</p>}{staged&&<div className="import-review"><strong>변경 미리보기 · {staged.inventory.rows.length}개 원본 행</strong><p>{staged.inventory.sourceFilename}</p><small>파일명 시각: {staged.inventory.filenameTimestamp} · 시간대·실제 재고 기준 시각 미확인</small>{staged.older&&<label className="older-warning"><input type="checkbox" checked={acceptOlder} onChange={e=>setAcceptOlder(e.target.checked)}/> 기존 파일보다 과거 시각입니다. 이전 자료임을 확인하고 반영합니다</label>}{staged.sameTime&&<p className="inventory-muted">기존 파일과 파일명 시각이 같습니다. 수량 변경 내역을 확인해 주세요</p>}<div className="import-changes">{staged.changes.map(c=><div key={c.id}><strong>{c.name.split(' (')[0]}</strong><span>{invNum(c.old)} → {c.status==="missing"?"이전값 유지":invNum(c.next)}</span><small className={c.status==="missing"?"import-error":""}>{c.detail}</small></div>)}</div><p className="inventory-muted">확인된 6개 연결 규칙만 사용합니다. 진드기 시트·소금총은 자동 연결하지 않습니다</p><div className="import-actions"><button onClick={cancel}>취소</button><button disabled={!canEdit||staged.older&&!acceptOlder} onClick={apply}>변경 반영</button></div></div>}</section>;
}

function InventoryView({prods,inventory,onApply,expandMappings=false}) {

 <div className="data-notice"><span className="notice-dot"/><p><strong>확인된 제품만 재고를 연결했습니다</strong> 확인된 제품 연결 규칙을 사용합니다. 야광끈끈이스틱의 1+1만 2개로 환산하고 나머지는 원본 상품 단위를 유지합니다. 새로운 제품은 임의 연결하지 않습니다.</p></div>

 <div className="inventory-summary"><div><span>원본 상품 행</span><strong>{INVENTORY.rows.length}</strong></div><div><span>확정 연결</span><strong>{inventoryConfirmed(prods)} <small>/ {prods.length}개 제품</small></strong></div><div><span>재고 기준 시각</span><strong className="small-value">원본에 없음</strong></div><div><span>대시보드 재고</span><strong className="small-value">{inventoryConfirmed(prods)}개 연결 · {prods.filter(p=>p.inventoryStale).length}개 이전값</strong></div></div>
 <div className="section-title"><div><p className="eyebrow">PRODUCT MAPPING</p><h2>제품별 연결 후보</h2></div><span className="inventory-muted">이전 재고는 참고값 · 현재 확정값과 구분</span></div>
 <div className="mapping-list" id="inventory-mappings">{prods.map(p=><details className="mapping-row" key={p.id} open={expandMappings||undefined}><summary><span><strong>{p.name}</strong><small>{p.confirmedInventory?`${p.inventoryStale?"이전값 (최신 아님)":"가용재고"} ${invNum(p.stock)}${p.confirmedInventory.formula?"개 (1+1 환산)":" · 원본 상품 단위"} · ${p.confirmedInventory.sourceName}`:`기존 대시보드 참고값 ${invNum(p.legacyStock??p.stock)} · 현재 재고 확인 필요`}</small></span><span className="mapping-pill" style={p.confirmedInventory?{background:"#e6f1e7",color:"#2d6839"}:undefined}>{p.inventoryStale?"원본 행 누락 ▾":p.confirmedInventory?"연결 확인됨 ▾":"연결 미확정 ▾"}</span></summary><div className="mapping-body">{p.confirmedInventory?.formula&&<strong style={{display:"block",color:"#2c643b",marginBottom:10}}>{p.confirmedInventory.formula}</strong>}<p>{INVENTORY.mapping[String(p.id)]?.note||"원본에 제품 코드가 없어 연결을 확정할 수 없습니다."}</p><div>{(p.inventoryStale?[]:p.confirmedInventory?(p.confirmedInventory.sourceRows||[p.confirmedInventory.sourceRow]):(INVENTORY.mapping[String(p.id)]?.candidates||[])).map(id=>{const r=INVENTORY.rows.find(x=>x.id===id);return r?<div className="candidate-line" key={id}><strong>{r.name}</strong><span>정상 {invNum(r.normal)} · 가용 {invNum(r.available)}</span></div>:null})}</div>{!(INVENTORY.mapping[String(p.id)]?.candidates||[]).length&&<small>확인된 후보 없음 · 원본 상품명과 제품 구성을 확인해 주세요</small>}</div></details>)}</div>

 <div className="inventory-table-scroll"><table className="inventory-table"><thead><tr><th>상품명</th><th>정상재고</th><th>불량재고</th><th>가용재고</th><th>처음입고수량</th></tr></thead><tbody>{rows.map(r=><tr key={r.id}><th scope="row">{r.name}</th><td>{invNum(r.normal)}</td><td>{invNum(r.defective)}</td><td><span className={r.available<0||r.available>r.normal?"inventory-warning":""}>{invNum(r.available)}</span></td><td>{invNum(r.initial)}</td></tr>)}</tbody></table>{rows.length===0&&<div className="empty-state">조건에 맞는 상품이 없습니다<button onClick={()=>{setQuery("");setOnlyIssues(false);}}>검색 초기화</button></div>}</div>
 <p className="inventory-footnote">{INVENTORY.publicMappedOnly?"공개 화면에는 확인된 연결에 필요한 상품 행만 포함됩니다. ":""}출처: {INVENTORY.sourceFilename} · 파일명 시각 {INVENTORY.filenameTimestamp} (시간대 미상, 재고 기준 시각으로 확인되지 않음) · 원본 열 이름 유지 · 제품별 수량은 단위가 달라 전체 합계로 표시하지 않습니다 · 상품명 외 식별자·창고·추출 시각·단위 정보 없음. 가용재고가 정상재고보다 크거나 음수인 행은 확인 대상으로 표시하며 원본 값을 수정하지 않았습니다.</p></section>;

function Overview({prods,onOpen,onTeam,onInventory}) {
 const [focus,setFocus]=useState("all");
 const tasks=prods.flatMap(p=>[...(p.pt||[]),...(p.ct||[]),...(p.mt||[])].map(t=>({...t,product:p})));
 const pending=tasks.filter(t=>!t.done); const unassigned=pending.filter(t=>!t.assignee);
 const deadlines=prods.flatMap(p=>[...(p.status!=="판매중"&&p.deadline?[{p,date:p.deadline,label:"출시 일정"}]:[]),...(p.reorder?.deadline?[{p,date:p.reorder.deadline,label:"재발주 입고"}]:[])]);
 const past=deadlines.filter(d=>dl(d.date)<0); const week=deadlines.filter(d=>dl(d.date)>=0&&dl(d.date)<=7);
 const stock=prods.filter(p=>p.inventoryStale||!p.confirmedInventory||p.stock===null||p.status==="판매중"&&p.stock===0);
 const filtered=prods.filter(p=>focus==="all"||focus==="dates"&&past.some(x=>x.p.id===p.id)||focus==="week"&&week.some(x=>x.p.id===p.id)||focus==="stock"&&stock.includes(p)||focus==="owner"&&unassigned.some(t=>t.product.id===p.id));
 const cards=[{key:"dates",label:"기한 확인",n:past.length,unit:"일정",desc:"지난 일정의 현재 상태 확인",tone:"coral",icon:"↗"},{key:"week",label:"이번 주",n:week.length,unit:"일정",desc:"기준일부터 7일 이내 도래",tone:"blue",icon:"◷"},{key:"stock",label:"재고 확인",n:stock.length,unit:"제품",desc:"연결 미확정 또는 확인 재고 0",tone:"amber",icon:"▣"},{key:"owner",label:"담당자 미정",n:unassigned.length,unit:"업무",desc:"미완료 업무에 담당자 배정",tone:"purple",icon:"◎"}];
 return <div className="overview"><section className="intro"><div><p className="eyebrow">OPERATIONAL BRIEF / {AS_OF}</p><h1>지금 확인할 일을,<br className="mobile-break"/> 한눈에.</h1><p className="intro-copy">제품의 진행 상태와 다음 할 일을 연결합니다</p></div><div className="snapshot-note"><span>운영 대시보드</span><strong>기존 데이터 실시간 연동</strong><small>일정은 오늘 기준으로 계산합니다</small></div></section>
 <div className="data-notice"><span className="notice-dot"/><p><strong>오래된 일정부터 확인해 주세요</strong> 지난 날짜는 상태 확인 대상입니다. 확인된 연결 규칙으로 재고를 표시합니다. 야광 1+1만 2개로 환산하며 연결되지 않은 제품은 확인이 필요합니다.</p></div>
 <section className="action-grid" aria-label="확인할 일">{cards.map(c=><button key={c.key} className={`action-card ${c.tone} ${focus===c.key?"chosen":""}`} onClick={()=>setFocus(focus===c.key?"all":c.key)} aria-pressed={focus===c.key}><div className="card-label">{c.label}<span>{c.icon}</span></div><div className="card-number">{c.n}<small>{c.unit}</small></div><p>{c.desc}</p><span className="card-cta">해당 제품 보기 →</span></button>)}</section>
 <section className="portfolio-strip"><div><strong>{prods.length}</strong><span>전체 제품</span></div><div><strong>{prods.filter(p=>p.status==="판매중").length}</strong><span>판매 중</span></div><div><strong>{prods.filter(p=>p.reorder).length}</strong><span>재발주 진행</span></div><div><button className="inventory-count-button" onClick={onInventory} aria-label={`재고 연결 ${prods.length}개 중 ${inventoryConfirmed(prods)}개 확인, 연결 내역 보기`}><strong style={{fontSize:18}}>{inventoryConfirmed(prods)}/{prods.length}</strong><span>재고 연결 확인 ↗</span></button></div><p><button className="inventory-link" onClick={onInventory}>가져온 재고 보기 ↗</button></p></section>
 <div className="section-title"><div><p className="eyebrow">PRODUCT PRIORITIES</p><h2>{focus==="all"?"제품별 다음 액션":cards.find(c=>c.key===focus)?.label+" · 해당 제품"}<span>{filtered.length}</span></h2></div>{focus!=="all"?<button className="text-link" onClick={()=>setFocus("all")}>전체 제품 보기 ↗</button>:<button className="text-link" onClick={onTeam}>팀별 업무 보기 ↗</button>}</div>
 <div className="priority-table"><div className="priority-head"><span>제품 / 진행 상태</span><span>다음 액션</span><span>담당자</span><span>확인할 일정</span><span/></div>{filtered.length===0&&<div className="empty-state">해당 조건에 맞는 일정이 없습니다<small>다른 확인 항목이나 전체 제품을 살펴보세요</small><button onClick={()=>setFocus("all")}>전체 제품 보기</button></div>}{filtered.map((p,i)=>{const open=[...(p.pt||[]),...(p.ct||[]),...(p.mt||[])].filter(t=>!t.done);const t=open[0];const d=p.reorder?.deadline||(p.status!=="판매중"?p.deadline:null);const stale=d&&dl(d)<0;const action=p.inventoryStale?"최근 파일의 누락 재고 행 확인":!p.confirmedInventory||p.stock===null?"원본 재고와 제품 연결 확인":p.status==="판매중"&&p.stock===0?"실재고 및 판매 가능 수량 확인":stale?(p.reorder?"입고 일정 확인":"완료 예정일과 진행 상태 확인"):t?.label||"진행 상태 및 다음 일정 확인";const all=[...(p.pt||[]),...(p.ct||[]),...(p.mt||[])];const done=all.filter(t=>t.done).length;return <button className="priority-row" key={p.id} onClick={()=>onOpen(p)}><div className="product-name"><span className="product-monogram">{String(i+1).padStart(2,"0")}</span><div><strong>{p.name.split(' (')[0]}</strong><small>{p.status}<span>·</span>{p.category||"분류 미정"}</small>{!p.reorder&&<div className="micro-progress"><span style={{width:(all.length?done/all.length*100:0)+"%"}}/></div>}</div></div><div className="next-action"><strong>{action}</strong><small>{p.reorder?`재발주 · ${displayReorderStatus(p.reorder.status)}`:`체크리스트 ${done}/${all.length} 완료 · 미완료 ${open.length}건`}</small></div><div className="owner-cell"><span>{(stale||p.status==="판매중"&&p.stock===0)?"확인 담당 미정":t?.assignee||"담당자 미정"}</span></div><div className="deadline-cell"><strong>{d?d.replaceAll('-','.'):'일정 미정'}</strong><small className={stale?"past":""}>{d?(stale?`기준일 대비 ${Math.abs(dl(d))}일 경과`:`${dl(d)}일 남음`):"일정 등록 필요"}</small></div><span className="row-arrow">↗</span></button>})}</div>
 <div className="overview-footnote"><span>액션은 입력된 상태와 날짜로 제안됩니다. 클릭하면 기존 기획·콘텐츠·마케팅 체크리스트를 확인할 수 있습니다.</span><span>미완료 업무 {pending.length}건</span></div></div>;
}

function nextChecklistTask(p){
 for(const [key,label] of [["pt","기획"],["ct","콘텐츠"],["mt","마케팅"]]){const task=(p[key]||[]).find(t=>!t.done);if(task)return {...task,taskType:key,typeLabel:label};}return null;
}
function NextProductTask({product:p}){
 const task=nextChecklistTask(p);
 if(!task)return <div className="product-next-task"><strong className="all-tasks-done">미완료 업무 없음</strong><small>상세에서 기존 업무 확인</small></div>;
 return <div className="product-next-task" title="미완료 목록에서 표시 순서상 첫 업무입니다. 우선순위는 별도로 정하지 않았습니다."><strong>{task.label}</strong><div><span className="next-task-type">{task.typeLabel}</span>{task.assignee?<AssigneeSelect value={task.assignee} readOnly/>:<span>담당자 미정</span>}</div><small>{task.deadline?`업무 기한 ${task.deadline.replaceAll('-','.')}`:"업무 기한 미정"}</small></div>;
}
function ProductStageOverview({product:p}) {
 const labels={"기획":"기획","발주":"발주","생산중":"생산 중","입고대기":"입고 대기","판매중":"판매 중"};
 const colors={"기획":["#f0eee9","#776f59"],"발주":["#edeaf6","#6a5d93"],"생산중":["#e7edf7","#3e6598"],"입고대기":["#faf0d9","#936d26"],"판매중":["#e6f1e8","#276642"]};
 return <div className="selling-stage"><span className="selling-status" style={{background:colors[p.status]?.[0]||"#eef0ed",color:colors[p.status]?.[1]||"#53604c"}}>● {labels[p.status]||p.status}</span>
 {p.reorder?<div className="selling-reorder"><strong>재발주 · {displayReorderStatus(p.reorder.status)}</strong><small>{p.reorder.deadline?`입고 예정 ${p.reorder.deadline.replaceAll('-','.')}`:"입고 일정 미정"}{p.reorder.deadline&&dl(p.reorder.deadline)<0?" · 확인 필요":""}</small></div>:p.status!=="판매중"&&p.deadline?<small className="stage-date" title="원본 제품 완료 예정일입니다. 생산 완료일이나 입고일로 추정하지 않습니다.">제품 완료 예정 {p.deadline.replaceAll('-','.')}{dl(p.deadline)<0?" · 확인 필요":""}</small>:null}
 </div>;
}


function cloudVersionKey(data){if(data?.clientRevision)return data.clientRevision;const value=data?.updatedAt;return value?.toDate?value.toDate().toISOString():String(value??"unversioned");}
function compactInventory(inv){const names=new Set(inv.mappingRules.flatMap(r=>(r.sources||[{sourceNameExact:r.sourceNameExact}]).map(s=>normalizeInventoryName(s.sourceNameExact))));return {...inv,rows:inv.rows.filter(r=>names.has(normalizeInventoryName(r.name))),publicMappedOnly:true};}
function prepareLiveInventory(prods,data){
 const baseInventory=data.inventory&&Array.isArray(data.inventory.rows)&&Array.isArray(data.inventory.mappingRules)?data.inventory:INITIAL_INVENTORY;
 if(data.inventory)return {prods,inventory:baseInventory};
 const stamp=data.updatedAt?.toDate?data.updatedAt.toDate().toISOString():data.updatedAt;
 if(stamp!=="2026-10-02T08:54:34.916Z")return {prods,inventory:{...INITIAL_INVENTORY,rows:[],sourceFilename:"최근 저장 데이터 · 재고 파일 재확인 필요",filenameTimestamp:"미확인"}};
 const seeded=buildInventoryImport(INITIAL_INVENTORY.rows,INITIAL_INVENTORY.sourceFilename,prods,INITIAL_INVENTORY);
 return {prods:seeded.prods.map(p=>({...p,legacyStock:prods.find(x=>x.id===p.id)?.stock})),inventory:seeded.inventory};
}

function App() {
  const [inventory,setInventory]=useState(()=>{const shared=getSharedData()?.inventory;return shared&&Array.isArray(shared.rows)&&Array.isArray(shared.mappingRules)?compactInventory(shared):INITIAL_INVENTORY;});
  const [expandMappings,setExpandMappings]=useState(false);
  const showInventoryMappings=()=>{setExpandMappings(true);setView("inventory");};
  const [prods, setProds] = useState(()=>{
    const saved = getData();
    const shared = getSharedData();
    const raw = saved || (shared?.prods) || INIT_RAW;
    return raw.map(migrate);
  });
  const [role,         setRole]          = useState("viewer");
  const roleRef=useRef(role);roleRef.current=role;
  const [members,      setMembers]       = useState(()=>{ const shared=getSharedData(); return getMembers() || shared?.members || ["김민준","이서연","박지호"]; });
  const [memberColors, setMemberColors]  = useState(()=>{ const shared=getSharedData(); return getMemberColors() || shared?.memberColors || {}; });
  const [view,         setView]          = useState("overview");
  useEffect(()=>{if(view==="inventory"&&expandMappings)document.getElementById("inventory-mappings")?.scrollIntoView({block:"start",behavior:"smooth"});},[view,expandMappings]);

  const [filter,       setFilter]        = useState("전체");
  const [search,       setSearch]        = useState("");
  const [sort,         setSort]          = useState("default");
  const [openId,       setOpenId]        = useState(null);
  const [tabMap,       setTabMap]        = useState({});
  const [showUnlock,   setShowUnlock]    = useState(false);
  const [showChangePin,setShowChangePin] = useState(false);
  const [backupOpen,   setBackupOpen]   = useState(false);
  const [dirty,        setDirtyState]    = useState(false);
  const [saveFlash,    setSaveFlash]     = useState(false);
  const [syncStatus,   setSyncStatus]   = useState(window.FIREBASE_OK ? "연결 중" : "오프라인");
  const dirtyRef = useRef(false);
  const cloudVersionRef=useRef(null);
  const setDirty=value=>{dirtyRef.current=value;setDirtyState(value);};
  const latestDraftRef=useRef(null);
  latestDraftRef.current=JSON.stringify({prods,members,memberColors,inventory:compactInventory(inventory)});
  useEffect(()=>{ dirtyRef.current = dirty; }, [dirty]);

  // 백업 드롭다운 외부 클릭 시 닫기
  useEffect(()=>{
    if(!backupOpen) return;
    const close = ()=>setBackupOpen(false);
    document.addEventListener("click", close);
    return ()=>document.removeEventListener("click", close);
  }, [backupOpen]);

  const upd     = (pid,fn) => { setProds(ps=>ps.map(p=>p.id===pid?fn(p):p)); setDirty(true); };
  const setF    = (pid,f,v) => upd(pid,p=>({...p,[f]:v,...(f==="stock"?{confirmedInventory:null,inventoryStale:false}:{})}));
  const setRF   = (pid,f,v) => upd(pid,p=>({...p,reorder:p.reorder?{...p.reorder,[f]:v}:null}));
  const updTask = (pid,type,fn) => upd(pid,p=>({...p,[type]:fn(p[type])}));
  const updGroupMeta = (pid,type,meta) => upd(pid,p=>({...p,[`${type}GroupMeta`]:meta}));
  const getTab  = id => tabMap[id]||"planning";
  const setTab  = (id,t) => setTabMap(m=>({...m,[id]:t}));

  const moveProd = (idx, dir) => {
    setProds(ps => {
      const arr = [...ps];
      const newIdx = idx + dir;
      if(newIdx < 0 || newIdx >= arr.length) return ps;
      [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
      return arr;
    });
    setDirty(true);
  };

  const editMember = (oldName, newName, newColor) => {
    setDirty(true);
    const updatedMembers = members.map(x => x===oldName ? newName : x);
    setMembers(updatedMembers); saveMembers(updatedMembers);
    const updatedColors = {...memberColors, [newName]: newColor};
    if(newName !== oldName) delete updatedColors[oldName];
    setMemberColors(updatedColors); saveMemberColors(updatedColors);
    if(newName !== oldName) {
      setProds(ps => ps.map(p => ({
        ...p,
        pt: p.pt.map(t => t.assignee===oldName ? {...t, assignee:newName} : t),
        ct: p.ct.map(t => t.assignee===oldName ? {...t, assignee:newName} : t),
        mt: p.mt.map(t => t.assignee===oldName ? {...t, assignee:newName} : t),
      })));
    }
  };

  const addProd = () => {
    const np = {
      id:Date.now(), name:"새 제품", url:"", category:"미분류", status:"기획",
      ordered:false, qty:0, stock:0, deadline:"", memo:"", reorder:null,
      image:null, price:0, cost:0, sku:"", description:"",
      pt: mkDefaultPT("기획"),
      ct:[mkT('기획서 작성','상세페이지'),mkT('촬영','상세페이지'),mkT('편집','상세페이지'),mkT('등록 완료','상세페이지'),mkT('썸네일 촬영','썸네일'),mkT('썸네일 편집','썸네일'),mkT('패키지 디자인','패키지'),mkT('상품 설명 검수','검수')],
      mt:[mkT('광고 이미지 제작','광고 소재'),mkT('광고 영상 제작','광고 소재'),mkT('SNS 포스팅 초안','SNS'),mkT('릴스/쇼츠 제작','SNS'),mkT('인플루언서 섭외','바이럴'),mkT('리뷰 의뢰','바이럴'),mkT('키워드 광고 등록','광고 집행'),mkT('스마트스토어 최적화','광고 집행')],
      groupMeta:{}, ptGroupMeta:{}, ctGroupMeta:{}, mtGroupMeta:{},
    };
    setProds(ps=>[...ps,np]); setDirty(true); setOpenId(np.id); setTab(np.id,"planning");
  };
  const delProd = pid => {
    if(window.confirm("이 제품을 삭제하시겠습니까?")) {
      setProds(ps=>ps.filter(p=>p.id!==pid)); setDirty(true);
      if(openId===pid) setOpenId(null);
    }
  };

  const handleSave = useCallback(async () => {
    if(role!=="editor")return;
    const payload={prods,members,memberColors,inventory:compactInventory(inventory)};
    const draftVersion=JSON.stringify(payload);
    try {
      if(window.FIREBASE_OK&&window.CLOUD_REF){
        if(cloudVersionRef.current===null)throw Error("동기화가 끝난 뒤 저장해 주세요.");
        setSyncStatus("저장 중...");
        const expected=cloudVersionRef.current;
        const nextRevision=`peston-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        await window.db.runTransaction(async tx=>{
          const current=await tx.get(window.CLOUD_REF);
          const version=current.exists?cloudVersionKey(current.data()):"missing";
          if(version!==expected)throw Error("다른 곳에서 데이터가 변경되었습니다. 현재 작업을 백업한 뒤 새로고침하고 다시 확인해 주세요.");
          tx.set(window.CLOUD_REF,{...payload,clientRevision:nextRevision,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
        });
        cloudVersionRef.current=nextRevision;
        setSyncStatus("동기화됨");
      }
      saveData(prods);
      if(latestDraftRef.current===draftVersion)setDirty(false);
      setSaveFlash(true);setTimeout(()=>setSaveFlash(false),2000);
    } catch(err){setSyncStatus("저장 오류");console.error("Firestore save error:",err);alert("저장하지 못했습니다: "+err.message);}
  },[prods,members,memberColors,inventory,role]);

  // 공유용 파일 저장 - 현재 데이터를 HTML에 포함해서 다운로드
  const handleSharedSave = () => {
    const html = document.documentElement.outerHTML;
    const dataStr = JSON.stringify({prods, members, memberColors,inventory:compactInventory(inventory)}).replace(/</g,"\\u003c");
    const updated = html.replace(
      /<script id="shared-data" type="application\/json">[\s\S]*?<\/script>/,
      `<script id="shared-data" type="application/json">${dataStr}<\/script>`
    );
    const blob = new Blob([updated], {type:"text/html;charset=utf-8"});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href=url; a.download=`peston-shared-${new Date().toISOString().slice(0,10)}.html`;
    a.click(); URL.revokeObjectURL(url);
  };

  const handleExport = () => {
    const data = { prods, members, memberColors,inventory:compactInventory(inventory), exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href=url; a.download=`peston-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
  };

  const handleImport = e => {
    if(role!=="editor"){e.target.value="";alert("편집 모드를 켠 뒤 복원해 주세요.");return;}
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      if(roleRef.current!=="editor")return;
      try {
        const data = JSON.parse(ev.target.result);
        if(!data.prods){ alert("올바른 백업 파일이 아닙니다."); return; }
        if(!window.confirm("현재 데이터를 백업 파일로 덮어쓰시겠습니까?")) return;
        setProds(data.prods.map(migrate)); saveData(data.prods);
        if(data.inventory?.rows&&data.inventory?.mappingRules)setInventory(compactInventory(data.inventory));
        if(data.members){ setMembers(data.members); saveMembers(data.members); }
        if(data.memberColors){ setMemberColors(data.memberColors); saveMemberColors(data.memberColors); }
        setDirty(true); setSaveFlash(false);
      } catch { alert("파일을 읽을 수 없습니다."); }
    };
    reader.readAsText(file); e.target.value="";
  };

  useEffect(()=>{
    const handler = e => { if((e.ctrlKey||e.metaKey)&&e.key==="s"){ e.preventDefault(); handleSave(); }};
    window.addEventListener("keydown",handler);
    return ()=>window.removeEventListener("keydown",handler);
  }, [handleSave]);

  // Firestore 실시간 동기화
  useEffect(()=>{
    if(!window.FIREBASE_OK || !window.CLOUD_REF){ setSyncStatus("오프라인"); return; }
    const unsub = window.CLOUD_REF.onSnapshot(
      doc => {
        if(doc.exists){
          const data = doc.data();
          if(!dirtyRef.current){
            cloudVersionRef.current=cloudVersionKey(data);
            if(data.prods){const live=prepareLiveInventory(data.prods.map(migrate),data);setProds(live.prods);setInventory(live.inventory);}
            if(data.members)      { setMembers(data.members); saveMembers(data.members); }
            if(data.memberColors) { setMemberColors(data.memberColors); saveMemberColors(data.memberColors); }
          }
          setSyncStatus("동기화됨");
        } else {
          // 문서 없음 - 첫 사용
          cloudVersionRef.current="missing";
          setSyncStatus("동기화됨");
        }
      },
      err => { console.error("Firestore error:", err); setSyncStatus("오류"); }
    );
    return () => unsub();
  }, []);

  const kpi = useMemo(()=>({
    total:      prods.length,
    selling:    prods.filter(p=>p.status==="판매중").length,
    producing:  prods.filter(p=>p.status==="생산중").length,
    waiting:    prods.filter(p=>p.status==="입고대기").length,
    reordering: prods.filter(p=>p.reorder).length,
    stock:      prods.reduce((s,p)=>s+p.stock,0),
    urgent:     prods.filter(p=>{ const d=dl(p.deadline); return d!==null&&d>=0&&d<=7; }).length,
  }),[prods]);

  const rows = useMemo(()=>{
    let list=[...prods];
    if(filter==="재발주중") list=list.filter(p=>p.reorder);
    else if(filter==="urgent") list=list.filter(p=>{ const d=dl(p.deadline); return d!==null&&d>=0&&d<=7; });
    else if(filter!=="전체") list=list.filter(p=>p.status===filter);
    if(search.trim()) list=list.filter(p=>p.name.includes(search.trim()));
    if(sort==="stock")    list.sort((a,b)=>b.stock-a.stock);
    if(sort==="deadline") list.sort((a,b)=>(a.deadline||"9999").localeCompare(b.deadline||"9999"));
    if(sort==="pipeline") list.sort((a,b)=>si(b.status)-si(a.status));
    if(sort==="pt")       list.sort((a,b)=>b.pt.filter(t=>t.done).length-a.pt.filter(t=>t.done).length);
    if(sort==="ct")       list.sort((a,b)=>b.ct.filter(t=>t.done).length-a.ct.filter(t=>t.done).length);
    if(sort==="mt")       list.sort((a,b)=>b.mt.filter(t=>t.done).length-a.mt.filter(t=>t.done).length);
    return list;
  },[prods,filter,search,sort]);

  const TODAY = AS_OF;

  return (
    <RoleCtx.Provider value={role}>
    <MembersCtx.Provider value={{ members, setMembers:value=>{setMembers(value);setDirty(true);}, memberColors, setMemberColors:value=>{setMemberColors(value);setDirty(true);} }}>
    <div className="min-h-screen bg-slate-50 font-sans">
      {showUnlock&&<UnlockModal onUnlock={()=>setRole("editor")} onClose={()=>setShowUnlock(false)}/>}
      {showChangePin&&<ChangePinModal onClose={()=>setShowChangePin(false)}/>}

      
      

      <header className="preview-header"><div className="brand"><span className="brand-symbol">P</span><strong>PESTON<span>OPERATIONS</span></strong></div><nav aria-label="주요 화면">{[["overview","대표 요약"],["products","제품 현황"],["team","팀 현황"],["inventory","가져온 재고"]].map(([key,label])=><button key={key} aria-current={view===key?"page":undefined} className={view===key?"active":""} onClick={()=>setView(key)}>{label}</button>)}</nav></header><div className="live-toolbar">          <div className="flex items-center gap-2">
            {/* 백업 드롭다운 (클릭 토글) */}
            <div className="relative" onClick={e=>e.stopPropagation()}>
              <button
                onClick={()=>setBackupOpen(b=>!b)}
                className="text-sm px-2.5 py-1.5 rounded-lg flex items-center gap-1 border bg-gray-50 text-gray-500 border-gray-200 hover:bg-gray-100 hover:text-gray-700 transition-all" title="백업 / 복원">
                🗂️ <span className="hidden sm:inline text-xs">백업</span>
                <span className="text-gray-400 text-xs">{backupOpen?"▴":"▾"}</span>
              </button>
              {backupOpen&&(
                <div className="absolute right-0 top-full mt-1 z-30 bg-white border border-gray-200 rounded-xl shadow-lg py-1.5 w-52">
                  <button onClick={()=>{handleExport();setBackupOpen(false);}}
                    className="w-full text-left text-xs px-3.5 py-2 hover:bg-blue-50 flex items-center gap-2 text-gray-700 hover:text-blue-600">
                    <span>📥</span>
                    <div><p className="font-medium">백업 다운로드</p><p className="text-gray-400 text-xs">JSON 파일로 저장</p></div>
                  </button>
                  <label className="w-full text-left text-xs px-3.5 py-2 hover:bg-amber-50 flex items-center gap-2 text-gray-700 hover:text-amber-600 cursor-pointer"
                    onClick={()=>setBackupOpen(false)}>
                    <span>📤</span>
                    <div><p className="font-medium">백업에서 복원</p><p className="text-gray-400 text-xs">JSON 파일 불러오기</p></div>
                    <input type="file" accept=".json" className="hidden" onChange={handleImport}/>
                  </label>
                  <div className="border-t border-gray-100 my-1"/>
                  <button onClick={()=>{handleSharedSave();setBackupOpen(false);}}
                    className="w-full text-left text-xs px-3.5 py-2 hover:bg-emerald-50 flex items-center gap-2 text-gray-700 hover:text-emerald-600">
                    <span>🔗</span>
                    <div><p className="font-medium">공유용 파일 저장</p><p className="text-gray-400 text-xs">다른 사람도 볼 수 있는 HTML</p></div>
                  </button>
                </div>
              )}
            </div>

            {/* 저장 */}
            <button onClick={handleSave} title="저장 (Ctrl+S)"
              className={`text-sm px-3 py-1.5 rounded-lg flex items-center gap-1.5 font-medium transition-all border
                ${saveFlash
                  ? "bg-emerald-500 text-white border-emerald-500 scale-95"
                  : dirty
                    ? "bg-blue-600 text-white border-blue-600 hover:bg-blue-700 shadow-sm animate-pulse"
                    : "bg-gray-50 text-gray-400 border-gray-200 hover:bg-gray-100 hover:text-gray-600"}`}>
              {saveFlash ? "✓ 저장됨" : "💾 저장"}
              {dirty&&!saveFlash&&<span className="w-1.5 h-1.5 rounded-full bg-white/80 inline-block ml-0.5"/>}
            </button>

            {/* 권한 */}
            {role==="editor"
              ?<div className="flex items-center gap-1.5">
                  <span className="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-1 rounded-lg font-medium flex items-center gap-1">
                    <span>🔓</span> 편집자
                  </span>
                  <button onClick={()=>setShowChangePin(true)} className="text-xs text-gray-400 hover:text-gray-600 px-1.5 py-1 rounded hover:bg-gray-100" title="PIN 변경">🔑</button>
                  <button onClick={()=>setRole("viewer")} className="text-xs text-gray-500 border border-gray-200 px-2 py-1 rounded-lg hover:bg-gray-50">잠금</button>
                </div>
              :<button onClick={()=>setShowUnlock(true)}
                  className="text-xs bg-gray-100 text-gray-600 hover:bg-blue-50 hover:text-blue-600 px-3 py-1.5 rounded-lg border border-gray-200 flex items-center gap-1.5 transition-colors">
                  <span>🔐</span> 편집 모드
                </button>
            }
            {role==="editor"&&(
              <button onClick={addProd}
                className="text-sm bg-blue-600 text-white px-3 py-1.5 rounded-lg hover:bg-blue-700 flex items-center gap-1.5 shadow-sm transition-colors flex-shrink-0">
                ＋ 제품 추가
              </button>
            )}
            <span className="text-xs text-gray-400 hidden sm:flex items-center gap-1.5">
              <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"/>{TODAY}
            </span>
            {/* 동기화 상태 */}
            {(()=>{
              const dot=syncStatus==="동기화됨"?"bg-emerald-400"
                :syncStatus==="저장 중..."?"bg-blue-400 animate-pulse"
                :syncStatus==="오류"||syncStatus==="저장 오류"?"bg-red-400"
                :syncStatus==="연결 중"?"bg-amber-400 animate-pulse"
                :"bg-gray-300";
              return (

                          </div>

                          {/* 일정 & 메모 */}
                          <div className="bg-white rounded-xl border border-gray-100 p-4">
                            <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">일정 & 메모</p>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                              <div>
                                <p className="text-xs text-gray-500 mb-1">완료 예정일</p>
                                <input type="date" className="text-sm border border-gray-200 rounded-lg px-2 py-1.5 w-full focus:outline-none" disabled={role!=="editor"}
                                  value={p.deadline} onChange={e=>setF(p.id,"deadline",e.target.value)}/>
                              </div>
                              <div>
                                <p className="text-xs text-gray-500 mb-1">메모</p>
                                <Editable value={p.memo||""} onChange={v=>setF(p.id,"memo",v)} className="text-sm text-gray-600 leading-relaxed" placeholder="메모를 입력하세요..."/>
                              </div>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div></div>
          </>
        )}

        {view==="inventory"&&<InventoryView prods={prods} inventory={inventory} expandMappings={expandMappings} onApply={next=>{if(role!=="editor")return;setProds(next.prods);setInventory(next.inventory);setDirty(true);}}/>}
        {view==="team"&&<TeamView prods={prods} onEditMember={editMember}/>}

        <footer className="preview-footer">PESTON / OPERATIONS <span>편집 후 상단 저장 · 일정 기준일 {AS_OF}</span></footer>
      </div>
    </div>
    </MembersCtx.Provider>
    </RoleCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
